<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Net Worth Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117; color: #c9d1d9; padding: 12px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: #f0f6fc; }
    .subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 16px; }
    .section { margin-bottom: 28px; }
    .section h2 { font-size: 1.05rem; color: #f0f6fc; margin-bottom: 10px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
    .chart-wrapper { position: relative; width: 100%; background: #161b22; border-radius: 8px; padding: 12px; }
    canvas { width: 100% !important; max-height: 350px; }
    .timeframe-bar {
      display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px;
    }
    .timeframe-bar button {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer;
      transition: background 0.15s;
    }
    .timeframe-bar button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .timeframe-bar button:hover { background: #30363d; }
    .stats-row {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
    }
    .stat-box {
      flex: 1 1 120px; background: #161b22; border-radius: 8px;
      padding: 10px 12px; text-align: center; min-width: 110px;
    }
    .stat-box .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
    .stat-box .value { font-size: 1.2rem; font-weight: 700; color: #f0f6fc; }
    .stat-box .delta { font-size: 0.7rem; margin-top: 2px; }
    .delta.pos { color: #3fb950; } .delta.neg { color: #f85149; }
    #gate {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 70vh;
    }
    #gate form { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 280px; width: 100%; }
    #gate input[type="password"] {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d;
      background: #0d1117; color: #f0f6fc; font-size: 1rem; outline: none;
    }
    #gate input[type="password"]:focus { border-color: #1f6feb; }
    #gate button {
      width: 100%; padding: 10px; background: #238636; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    #gate .error { color: #f85149; font-size: 0.85rem; margin-top: 4px; min-height: 20px; }
    #dashboard { display: none; }
    .proj-controls {
      background: #161b22; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .proj-controls label {
      display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; color: #8b949e;
      text-transform: uppercase; min-width: 100px; flex: 1 1 130px;
    }
    .proj-controls input { 
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 6px 8px; color: #f0f6fc; font-size: 0.85rem; width: 100%;
    }
    .proj-controls input:focus { border-color: #1f6feb; outline: none; }
    .proj-controls button {
      background: #238636; color: #fff; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 0.8rem; cursor: pointer; margin-top: 8px;
    }
    /* Achievements panel */
    .ach-toggle {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
      margin-bottom: 12px; width: 100%; text-align: left; display: flex;
      justify-content: space-between; align-items: center;
    }
    .ach-toggle:hover { background: #30363d; }
    .milestone-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-bottom: 1px solid #21262d; font-size: 0.82rem;
    }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-icon { font-size: 1.1rem; width: 24px; text-align: center; }
    .milestone-name { flex: 1; min-width: 120px; }
    .milestone-progress { flex: 2; }
    .progress-bar-bg {
      height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; margin-top: 2px;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 3px; transition: width 0.3s;
    }
    .progress-bar-fill.done { background: #3fb950; }
    .progress-bar-fill.close { background: #d29922; }
    .progress-bar-fill.far { background: #30363d; }
    .milestone-date { font-size: 0.72rem; color: #8b949e; min-width: 90px; text-align: right; }
    .milestone-status { font-size: 0.72rem; min-width: 50px; text-align: right; }
    .milestone-status.done { color: #3fb950; }
    .milestone-status.close { color: #d29922; }
    .milestone-status.far { color: #8b949e; }
    .ach-group-title {
      font-size: 0.72rem; color: #8b949e; text-transform: uppercase;
      padding: 10px 10px 4px; letter-spacing: 0.5px;
    }
    @media (max-width: 480px) {
      body { padding: 8px; }
      .stats-row { gap: 6px; }
      .stat-box { flex: 1 1 90px; min-width: 80px; padding: 8px; }
      .stat-box .value { font-size: 1rem; }
      .proj-controls { gap: 8px; }
      .proj-controls label { min-width: 80px; flex: 1 1 100px; }
    }
  </style>
</head>
<body>
<div id="gate">
  <form onsubmit="event.preventDefault(); checkPassword(); return false;">
    <h1 style="text-align:center;margin-bottom:8px;">🔒 Net Worth</h1>
    <input type="password" id="pw-input" placeholder="Enter password" autofocus>
    <button type="submit">Unlock</button>
    <div class="error" id="pw-error"></div>
  </form>
</div>

<div id="dashboard" class="container">
  <h1>💰 Net Worth Dashboard</h1>
  <div class="subtitle" id="dateRange"></div>

  <div class="stats-row" id="statsRow"></div>

  <!-- CHART 1: Net Worth -->
  <div class="section">
    <h2>Net Worth</h2>
    <div class="timeframe-bar" id="timeframeBarNW"></div>
    <div class="chart-wrapper"><canvas id="chartNetWorth"></canvas></div>
  </div>

  <!-- CHART 2: Projections -->
  <div class="section" id="projectionSection">
    <h2>Projections (30 years)</h2>
    <div class="proj-controls" id="projControls">
      <label>Investment growth (%/yr) <input type="number" id="projGrowth" value="7" step="0.5" min="0" max="30"></label>
      <button onclick="recalcProjections()">Update</button>
    </div>
    <div style="font-size:0.72rem;color:#8b949e;margin-bottom:10px;line-height:1.5">
      Starting from your current net worth, with income and expenses from your latest snapshot.
      The <b>solid line</b> is the median forecast; the <b>shaded band</b> covers 80% of possible outcomes.
    </div>
    <div class="chart-wrapper"><canvas id="chartProjections"></canvas></div>
  </div>

  <!-- CHART 3: Retirement vs Non-Retirement -->
  <div class="section">
    <h2>Retirement vs Non-Retirement</h2>
    <div class="timeframe-bar" id="timeframeBarStacked"></div>
    <div class="chart-wrapper"><canvas id="chartStacked"></canvas></div>
  </div>

  <!-- ACHIEVEMENTS -->
  <div class="section">
    <button class="ach-toggle" onclick="toggleAchievements()">
      🏆 Achievements <span id="achCaret" style="font-size:0.7rem;">▶</span>
    </button>
    <div id="achPanel" style="display:none;background:#161b22;border-radius:8px;padding:4px 0;margin-top:-4px;" class="chart-wrapper"></div>
  </div>
</div>

<script>
const DATA = {"series": {"dates": ["2024-01-01", "2024-03-01", "2024-06-01", "2024-09-01", "2025-01-01", "2025-04-01", "2025-07-01", "2025-10-01", "2026-01-01", "2026-04-01", "2026-07-01", "2026-08-01"], "net_worth_total": [606000.0, 660000.0, 693500.0, 734000.0, 788500.0, 820000.0, 885500.0, 922000.0, 985000.0, 1011500.0, 1077000.0, 1069500.0], "net_worth_ex_housing": [526000.0, 572000.0, 595500.0, 625000.0, 660500.0, 678000.0, 726500.0, 752000.0, 801000.0, 816500.0, 868000.0, 855500.0], "retirement": [360000.0, 387000.0, 403000.0, 420000.0, 445000.0, 475000.0, 505000.0, 522000.0, 550000.0, 573000.0, 605000.0, 595000.0], "non_retirement": [546000.0, 570000.0, 584500.0, 605000.0, 630500.0, 628000.0, 659500.0, 675000.0, 706000.0, 705500.0, 735000.0, 735500.0]}, "current": {"mortgage_balance": 261000, "home_equity": 475000, "income": null, "expenses": null}, "password": {"hash": "71fd8950a18249e5d14a7b86e0ef1a9efb8ab2062e412e95dd1c48053575d3c5", "salt": "6f32f228ebaa31f77c3f33e34baa3fd3"}, "password_enabled": false};

// --- Password gate ---
function sha256(str) {
  const encoder = new TextEncoder();
  return crypto.subtle.digest('SHA-256', encoder.encode(str))
    .then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''));
}
async function checkPassword() {
  const input = document.getElementById('pw-input').value;
  const hash = await sha256(DATA.password.salt + input);
  if (hash === DATA.password.hash) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('pw-error').textContent = 'Wrong password';
  }
}

// --- Colors ---
const CC = {
  total: '#1f6feb', exHousing: '#3fb950', retirement: '#d29922', nonRetirement: '#1f6feb',
  projP50: '#a5d6ff', projBand: 'rgba(165,214,255,0.15)',
  grid: 'rgba(201,209,217,0.1)', tick: '#8b949e',
  milestoneDone: '#3fb950', milestoneClose: '#d29922', milestoneFar: '#8b949e',
};

function fmtShort(n) {
  if (n == null || isNaN(n)) return 'N/A';
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (abs >= 1000) return (n / 1000).toFixed(0) + 'K';
  return n.toFixed(0);
}

// --- Timeframes ---
const TF_MAIN = { 'YTD': 'ytd', '1Y': 12, '5Y': 60, 'All': 'all' };
function filterDates(dates, seriesArr, tf) {
  if (tf === 'all') return { dates, series: seriesArr };
  const lastDate = new Date(dates[dates.length - 1]);
  let cutoff;
  if (tf === 'ytd') { cutoff = new Date(lastDate.getFullYear(), 0, 1); }
  else { cutoff = new Date(lastDate); cutoff.setMonth(cutoff.getMonth() - tf); }
  const idx = [];
  dates.forEach((d, i) => { if (new Date(d) >= cutoff || i >= dates.length - 2) idx.push(i); });
  return { dates: idx.map(i => dates[i]), series: seriesArr.map(s => idx.map(i => s[i])) };
}

let charts = {};
function killChart(k) { if (charts[k]) { charts[k].destroy(); charts[k] = null; } }
let tf = { nw: 'All', stacked: 'All' };
function makeTFBar(parentId, key, labels, redraw) {
  const bar = document.getElementById(parentId);
  bar.innerHTML = '';
  Object.keys(labels).forEach(l => {
    const btn = document.createElement('button');
    btn.textContent = l; btn.className = tf[key] === l ? 'active' : '';
    btn.onclick = () => { tf[key] = l; bar.querySelectorAll('button').forEach(b => b.className = ''); btn.className = 'active'; redraw(); };
    bar.appendChild(btn);
  });
}
function baseOpts() {
  return {
    responsive: true, maintainAspectRatio: true,
    plugins: { legend: { labels: { color: '#8b949e', font: { size: 11 } } } },
    scales: {
      x: { ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8 } },
      y: { ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtShort(v) }, grid: { color: CC.grid } }
    },
    interaction: { intersect: false, mode: 'index' },
  };
}

// --- Projection engine ---
let projCache = null;
function calcProjections(expenses, income, growthPct) {
  const s = DATA.series;
  const lastIdx = s.dates.length - 1;
  const totalNW = s.net_worth_total[lastIdx];
  const horizonMonths = 30 * 12;
  const r = growthPct / 100, monthlyGrowth = r / 12;
  const netSavings = (income - expenses) / 12;
  const p50 = []; let nw = totalNW;
  for (let m = 0; m <= horizonMonths; m++) { p50.push(Math.round(nw)); nw = nw * (1 + monthlyGrowth) + Math.max(0, netSavings); }
  const vol = 0.15 / Math.sqrt(12); const runs = 200; const paths = [];
  for (let rn = 0; rn < runs; rn++) {
    const path = []; let val = totalNW;
    for (let m = 0; m <= horizonMonths; m++) { path.push(Math.round(val)); val = val * Math.exp((monthlyGrowth - 0.5*vol*vol) + randn_bm()*vol) + Math.max(0, netSavings); }
    paths.push(path);
  }
  const p10 = [], p90 = [];
  for (let m = 0; m <= horizonMonths; m++) { const v = paths.map(p => p[m]).sort((a,b)=>a-b); p10.push(v[Math.floor(runs*0.10)]); p90.push(v[Math.floor(runs*0.90)]); }
  const lastDate = new Date(s.dates[lastIdx]); const projDates = [];
  for (let m = 0; m <= horizonMonths; m++) { const d = new Date(lastDate); d.setMonth(d.getMonth()+m); projDates.push(d.toISOString().slice(0,10)); }
  return { projDates, p50, p10, p90 };
}

function drawProjectionsFn() {
  killChart('projections');
  if (!projCache) recalcProjections();
  const p = projCache;
  const milestones = buildMilestones(p);

  charts.projections = new Chart(document.getElementById('chartProjections').getContext('2d'), {
    type: 'line',
    data: {
      labels: p.projDates,
      datasets: [
        { label: 'Lower range (p10)', data: p.p10, borderColor: 'transparent', backgroundColor: 'transparent', fill: false, pointRadius: 0 },
        { label: 'Most likely (median)', data: p.p50, borderColor: CC.projP50, fill: false, tension: 0.3, pointRadius: 1, borderWidth: 2 },
        { label: 'Realistic range (80% of outcomes)', data: p.p90, borderColor: 'transparent', backgroundColor: CC.projBand, fill: '-1', tension: 0.3, pointRadius: 0 },
        ...milestones.filter(m => m.type === 'liquid' || m.type === 'fire').map(m => ({
          label: m.name,
          data: new Array(p.projDates.length).fill(m.value),
          borderColor: m.status === 'done' ? CC.milestoneDone : (m.status === 'close' ? CC.milestoneClose : CC.milestoneFar),
          borderDash: [3, 3], borderWidth: 1, fill: false, pointRadius: 0,
        })),
      ]
    },
    options: {
      ...baseOpts(),
      plugins: {
        legend: {
          labels: {
            color: '#8b949e', font: { size: 10 },
            filter: function(item) { return !item.text.startsWith('$'); },
          }
        }
      }
    },
  });
}

function recalcProjections() {
  const growth = parseFloat(document.getElementById('projGrowth').value) || 7;
  const c = DATA.current || {};
  const expenses = c.expenses || 96000;
  const income = c.income || 200000;
  projCache = calcProjections(expenses, income, growth);
  drawProjectionsFn();
  buildAchievementPanel();
}

function randn_bm() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

// --- Milestones ---
function getCurrentValues() {
  const s = DATA.series; const li = s.dates.length - 1;
  return {
    liquidNW: s.net_worth_ex_housing[li],
    totalNW: s.net_worth_total[li],
    retirement: s.retirement[li],
    nonRetirement: s.non_retirement[li],
    homeEquity: s.net_worth_total[li] - s.net_worth_ex_housing[li], // approximate
  };
}

function buildMilestones(proj) {
  const cur = getCurrentValues();
  const c = DATA.current || {};
  const expenses = c.expenses || 96000;

  function findCrossMonth(target) {
    for (let m = 0; m < proj.p50.length; m++) { if (proj.p50[m] >= target) return m; }
    return -1;
  }
  function crossDate(months) {
    if (months < 0) return null;
    const d = new Date(proj.projDates[months]);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
  }

  const milestones = [];

  // Liquid NW milestones ($1M-$10M)
  [1e6, 2e6, 3e6, 4e6, 5e6, 7.5e6, 10e6].forEach(v => {
    const pct = cur.liquidNW / v;
    const m = findCrossMonth(v);
    milestones.push({
      type: 'liquid', name: '$' + fmtShort(v) + ' liquid', value: v,
      current: cur.liquidNW, pct, crossMonths: m, crossDate: crossDate(m),
      status: cur.liquidNW >= v ? 'done' : (pct >= 0.75 ? 'close' : 'far'),
    });
  });

  // Home equity %
  const homeEq = cur.homeEquity;
  const mortgageRemaining = homeEq > 0 ? homeEq : (cur.totalNW - cur.liquidNW); // rough
  // We need real mortgage data — approximate from the difference
  // For now: home equity % of total home value isn't known without the raw data.
  // We'll estimate: if liquid NW = total NW - homeEquity, then homeEquity is what we have.
  // 50%/75%/100% ownership means home equity >= 50% of (home equity + mortgage)
  // Since we don't have mortgage directly, skip for now — user will add real data later.
  // Placeholder: show as "need real mortgage data"
  if (DATA.current && DATA.current.mortgage_balance != null) {
    const totalHome = homeEq + DATA.current.mortgage_balance;
    [0.50, 0.75, 1.0].forEach(pct => {
      const needed = totalHome * pct;
      const curPct = totalHome > 0 ? homeEq / totalHome : 0;
      milestones.push({
        type: 'home', name: (pct*100).toFixed(0) + '% home equity', value: needed,
        current: homeEq, pct: curPct / pct, crossMonths: -1, crossDate: null,
        status: curPct >= pct ? 'done' : (curPct >= pct*0.75 ? 'close' : 'far'),
      });
    });
  }

  // FIRE milestones
  const fireTargets = [
    { name: 'Coast FIRE', mult: 0, desc: 'investments will grow to cover retirement by 65' },
    { name: 'Lean FIRE', mult: 25, desc: '25× annual expenses' },
    { name: 'Full FIRE', mult: 33, desc: '33× expenses (3% SWR)' },
    { name: 'Fat FIRE', mult: 40, desc: '40× expenses — luxury forever' },
  ];
  fireTargets.forEach(ft => {
    const target = ft.mult > 0 ? expenses * ft.mult : cur.liquidNW; // Coast FIRE: use current as target (always "not yet" unless we calculate properly)
    const pct = ft.mult > 0 ? cur.liquidNW / target : 0.5;
    const m = ft.mult > 0 ? findCrossMonth(target) : -1;
    milestones.push({
      type: 'fire', name: ft.name, value: target, desc: ft.desc,
      current: ft.mult > 0 ? cur.liquidNW : 0, pct,
      crossMonths: m, crossDate: crossDate(m),
      status: ft.mult > 0 && cur.liquidNW >= target ? 'done' : (pct >= 0.75 ? 'close' : 'far'),
    });
  });

  // Bridge fund (non-retirement liquid / expenses)
  [1, 3, 5].forEach(yrs => {
    const target = expenses * yrs;
    const pct = cur.nonRetirement / target;
    milestones.push({
      type: 'bridge', name: yrs + '-year bridge', value: target,
      desc: yrs + ' years of expenses in non-retirement accounts',
      current: cur.nonRetirement, pct,
      crossMonths: -1, crossDate: null,
      status: cur.nonRetirement >= target ? 'done' : (pct >= 0.75 ? 'close' : 'far'),
    });
  });

  return milestones;
}

// --- Achievements panel ---
function buildAchievementPanel() {
  if (!projCache) return;
  const milestones = buildMilestones(projCache);
  const panel = document.getElementById('achPanel');
  if (!panel) return;

  const groups = [
    { key: 'liquid', title: '💰 Liquid Net Worth' },
    { key: 'fire', title: '🔥 FIRE Milestones' },
    { key: 'bridge', title: '🌉 Bridge Fund (non-retirement)' },
    { key: 'home', title: '🏠 Home Equity' },
  ];

  let html = '';
  groups.forEach(g => {
    const items = milestones.filter(m => m.type === g.key);
    if (items.length === 0) return;
    html += '<div class="ach-group-title">' + g.title + '</div>';
    items.forEach(m => {
      const pct = Math.min(100, Math.max(0, m.pct * 100));
      const barClass = m.status === 'done' ? 'done' : (m.status === 'close' ? 'close' : 'far');
      const statusText = m.status === 'done' ? '✅' : (m.status === 'close' ? '🔶' : '⬜');
      const dateText = m.crossDate ? 'Est. ' + m.crossDate : (m.status === 'done' ? 'Done' : '');
      html += '<div class="milestone-row">';
      html += '<div class="milestone-icon">' + statusText + '</div>';
      html += '<div class="milestone-name">' + m.name + (m.desc ? '<div style="font-size:0.68rem;color:#8b949e">' + m.desc + '</div>' : '') + '</div>';
      html += '<div class="milestone-progress"><div class="progress-bar-bg"><div class="progress-bar-fill ' + barClass + '" style="width:' + pct + '%"></div></div></div>';
      html += '<div class="milestone-date">' + dateText + '</div>';
      html += '<div class="milestone-status ' + barClass + '">' + pct.toFixed(0) + '%</div>';
      html += '</div>';
    });
  });
  panel.innerHTML = html || '<div style="padding:12px;color:#8b949e">Add real data to see achievements.</div>';
}

function toggleAchievements() {
  const panel = document.getElementById('achPanel');
  const caret = document.getElementById('achCaret');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    caret.textContent = '▼';
    buildAchievementPanel();
  } else {
    panel.style.display = 'none';
    caret.textContent = '▶';
  }
}

// --- Main ---
function initDashboard() {
  const s = DATA.series;
  const lastIdx = s.dates.length - 1;
  const prevIdx = Math.max(0, lastIdx - 1);
  const nw = s.net_worth_total[lastIdx];
  const nwPrev = s.net_worth_total[prevIdx];
  const delta = nw - nwPrev;
  const deltaPct = nwPrev > 0 ? (delta / nwPrev * 100) : 0;
  const nwEx = s.net_worth_ex_housing[lastIdx];
  const ret = s.retirement[lastIdx];

  document.getElementById('dateRange').textContent = `Latest: ${s.dates[lastIdx]} · ${s.dates.length} snapshots · ${s.dates[0]} → ${s.dates[lastIdx]}`;
  document.getElementById('statsRow').innerHTML = [
    { l: 'Net Worth', v: '$'+fmtShort(nw), d: `${delta>=0?'+':''}$${fmtShort(Math.abs(delta))} (${deltaPct>=0?'+':''}${deltaPct.toFixed(1)}%)`, pos: delta>=0 },
    { l: 'Excl. Home', v: '$'+fmtShort(nwEx), d: '', pos: true },
    { l: 'Retirement', v: '$'+fmtShort(ret), d: '', pos: true },
    { l: 'Snapshots', v: s.dates.length, d: '', pos: true },
  ].map(st => `<div class="stat-box"><div class="label">${st.l}</div><div class="value">${st.v}</div>${st.d ? `<div class="delta ${st.pos?'pos':'neg'}">${st.d}</div>` : ''}</div>`).join('');

  makeTFBar('timeframeBarNW', 'nw', TF_MAIN, drawNW);
  drawNW();
  document.getElementById('projGrowth').value = '7';
  recalcProjections();
  makeTFBar('timeframeBarStacked', 'stacked', TF_MAIN, drawStacked);
  drawStacked();
}

function drawNW() {
  killChart('nw');
  const f = filterDates(DATA.series.dates, [DATA.series.net_worth_total, DATA.series.net_worth_ex_housing], TF_MAIN[tf.nw]);
  charts.nw = new Chart(document.getElementById('chartNetWorth').getContext('2d'), {
    type: 'line',
    data: {
      labels: f.dates,
      datasets: [
        { label: 'Total', data: f.series[0], borderColor: CC.total, backgroundColor: 'rgba(31,111,235,0.1)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 },
        { label: 'Excl. Home Equity', data: f.series[1], borderColor: CC.exHousing, borderDash: [5,3], fill: false, tension: 0.3, pointRadius: 2, borderWidth: 2 },
      ]
    },
    options: baseOpts(),
  });
}

function drawStacked() {
  killChart('stacked');
  const f = filterDates(DATA.series.dates, [DATA.series.retirement, DATA.series.non_retirement], TF_MAIN[tf.stacked]);
  charts.stacked = new Chart(document.getElementById('chartStacked').getContext('2d'), {
    type: 'bar',
    data: {
      labels: f.dates,
      datasets: [
        { label: 'Non-Retirement', data: f.series[1], backgroundColor: CC.nonRetirement, borderRadius: 2 },
        { label: 'Retirement', data: f.series[0], backgroundColor: CC.retirement, borderRadius: 2 },
      ]
    },
    options: {
      ...baseOpts(),
      scales: {
        x: { stacked: true, ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8 } },
        y: { stacked: true, ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtShort(v) }, grid: { color: CC.grid } }
      }
    },
  });
}

// --- Auto-init when password disabled ---
(function() {
  if (!DATA.password_enabled) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  }
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Net Worth Dashboard</title>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/chartjs-plugin-datalabels.min.js"></script>
  <script src="vendor/chartjs-plugin-annotation.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000; color: #c9d1d9; padding: 12px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: #f0f6fc; }
    .subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 16px; }
    .section { margin-bottom: 28px; }
    .section h2 { font-size: 1.05rem; color: #f0f6fc; margin-bottom: 10px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
    .chart-wrapper { position: relative; width: 100%; margin-top: 52px; background: #0b0b0b; border: 1px solid #27231a; border-radius: 8px; padding: 12px; }
    canvas { width: 100% !important; max-height: 350px; }
    .timeframe-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .timeframe-bar button {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer;
      transition: background 0.15s;
    }
    .timeframe-bar button.active { background: #C9A961; border-color: #C9A961; color: #000; }
    .timeframe-bar button:hover { background: #30363d; }
    .chart-change { color: #8b949e; font-size: 0.72rem; margin: -5px 0 10px; }
    .chart-change .positive { color: #69db7c; }
    .chart-change .negative { color: #ff7b72; }
    .stats-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .stat-box {
      flex: 1 1 120px; background: #0b0b0b; border: 1px solid #27231a; border-radius: 8px;
      padding: 10px 12px; text-align: center; min-width: 110px;
    }
    .stat-box .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
    .stat-box .value { font-size: 1.2rem; font-weight: 700; color: #f0f6fc; }

    #gate form { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 280px; width: 100%; }

    #gate input[type="password"]:focus { border-color: #C9A961; }

      width: 100%; padding: 10px; background: #C9A961; color: #000;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    #gate .error { color: #f85149; font-size: 0.85rem; margin-top: 4px; min-height: 20px; }
    #dashboard { display: none; }
    .proj-controls {
      background: #0b0b0b; border: 1px solid #27231a; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .proj-controls label {
      display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; color: #8b949e;
      text-transform: uppercase; min-width: 100px; flex: 1 1 130px;
    }
    .proj-controls input {

      padding: 6px 8px; color: #f0f6fc; font-size: 0.85rem; width: 100%;
    }
    .proj-controls input:focus, .proj-controls select:focus { border-color: #C9A961; outline: none; }
    .proj-scenario { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #8b949e; font-size: 0.76rem; }
    .proj-scenario label { color: #f0f6fc; font-weight: 650; }
    .proj-scenario select { background: #000; border: 1px solid #C9A961; border-radius: 6px; padding: 7px 9px; color: #f0f6fc; font-size: 0.82rem; }
    .advanced-settings { margin-bottom: 12px; border: 1px solid #27231a; border-radius: 8px; background: #0b0b0b; }

    .advanced-settings summary:focus-visible { outline: 2px solid #C9A961; outline-offset: -2px; }
    .advanced-settings .proj-controls { border: 0; border-top: 1px solid #27231a; border-radius: 0; margin: 0; }
    .proj-controls button {
      background: #C9A961; color: #000; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 0.8rem; cursor: pointer; margin-top: 8px;
    }
    .proj-controls button:hover { background: #2ea043; }
    .tt-dismiss {
      display: none; align-items: center; justify-content: center;
      position: absolute; top: -52px; right: 0; z-index: 10;
      width: 44px; height: 44px; background: rgba(0,0,0,0.82); color: #C9A961;
      border: 1px solid #C9A961; border-radius: 50%; padding: 0;

    .tt-dismiss:hover, .tt-dismiss:focus-visible { background: #C9A961; color: #000; transform: scale(1.06); outline: none; }

    .seg-control { display: flex; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; flex-shrink: 0; }

    .seg-control button.active { background: #C9A961; color: #000; }
    .ach-toggle {

      padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;

    .ach-table tr:last-child td { border-bottom: none; }

    .ach-table .ach-date { text-align: right; min-width: 75px; font-size: 0.72rem; color: #8b949e; }
    .ach-table .ach-done { color: #3fb950; }
    .ach-table .ach-close { color: #d29922; }
    .ach-table .ach-far { color: #8b949e; }

    .ach-bar-fill { height: 100%; border-radius: 3px; max-width: 100%; }
    .ach-bar-fill.done { background: #3fb950; }
    .ach-bar-fill.close { background: #d29922; }
    .ach-bar-fill.far { background: #30363d; }
    .ach-group-title { font-size: 0.72rem; color: #8b949e; text-transform: uppercase; padding: 10px 10px 4px; letter-spacing: 0.5px; }
    .ach-header { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }

    .ach-summary { color: #C9A961; font-size: 0.8rem; }
    .ach-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; width: auto; margin-bottom: 0; background: #C9A961; color: #000; border: 0; border-radius: 999px; padding: 8px 13px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }

    .achievement-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    .achievement-card.done { border-color: rgba(105,219,124,0.55); }

    .achievement-card-title { color: #f0f6fc; font-size: 0.88rem; font-weight: 650; }
    .achievement-card-category { color: #8b949e; font-size: 0.68rem; margin-top: 2px; }
    .achievement-status { font-size: 0.68rem; font-weight: 700; white-space: nowrap; }
    .achievement-status.done { color: #69db7c; }
    .achievement-status.close { color: #d7a84b; }
    .achievement-status.far { color: #8b949e; }
    .achievement-description { color: #8b949e; font-size: 0.72rem; line-height: 1.35; margin: 10px 0 9px; min-height: 1.9em; }
    .achievement-progress { position: relative; height: 8px; background: #21262d; border-radius: 5px; overflow: hidden; }
    .achievement-progress-fill { height: 100%; border-radius: 5px; background: #8b949e; }

    .achievement-progress-fill.done { background: #69db7c; }

    .achievement-card-foot { display: flex; justify-content: space-between; gap: 8px; color: #b8b8b8; font-size: 0.7rem; margin-top: 7px; }
    .achievement-card-foot span:last-child { color: #a9a9a9; text-align: right; }
    .achievement-card-foot .no-date { color: #c9c9c9; }
    .achievement-ladder { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; padding-top: 10px; border-top: 1px solid #27231a; }
    .achievement-ladder-item { color: #8b949e; font-size: 0.67rem; background: #151515; border-radius: 999px; padding: 4px 7px; white-space: nowrap; }
    .achievement-ladder-item.done { color: #69db7c; }
    .achievement-ladder-item.current { color: #d7a84b; border: 1px solid rgba(215,168,75,0.65); font-weight: 700; }
    .achievement-ladder-item.far { color: #8b949e; }

    .achievement-explainer { margin-top: 9px; color: #8b949e; font-size: 0.68rem; }
    .achievement-explainer summary { cursor: pointer; color: #C9A961; }
    .achievement-explainer p { margin: 5px 0 0; line-height: 1.35; }
    .trophy-case { margin: 0 0 12px; background: #0b0b0b; border: 1px solid #27231a; border-radius: 10px; padding: 9px 12px; }
    .trophy-case summary { cursor: pointer; color: #C9A961; font-size: 0.78rem; font-weight: 700; }
    .trophy-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .trophy-chip { color: #69db7c; background: rgba(105,219,124,0.08); border: 1px solid rgba(105,219,124,0.3); border-radius: 999px; padding: 4px 8px; font-size: 0.67rem; white-space: nowrap; }

      body { padding: 8px; }
      .stats-row { gap: 6px; }
      .stat-box { flex: 1 1 90px; min-width: 80px; padding: 8px; }
      .stat-box .value { font-size: 1rem; }
      .proj-controls { gap: 8px; }
      .proj-controls label { min-width: 80px; flex: 1 1 100px; }
    }
  </style>
</head>
<body>
<div id="gate">
  <form onsubmit="event.preventDefault(); checkPassword(); return false;">
    <h1 style="text-align:center;margin-bottom:8px;">🔒 Net Worth</h1>
    <input type="password" id="pw-input" placeholder="Enter password" autocomplete="current-password" aria-label="Dashboard password" autofocus>
    <button type="submit">Unlock</button>
    <div class="error" id="pw-error" role="alert" aria-live="polite"></div>
  </form>
</div>

<div id="dashboard" class="container">
  <h1>💰 Net Worth Dashboard</h1>
  <div class="subtitle" id="dateRange"></div>
  <div class="stats-row" id="statsRow"></div>

  <div class="section">
    <h2>Net Worth</h2>
    <div class="timeframe-bar" id="timeframeBarNW"></div>
    <div class="chart-change" id="nwChange" aria-live="polite"></div>
    <div class="chart-wrapper"><button class="tt-dismiss" id="ttDismissNW" onclick="dismissTooltip('nw')" aria-label="Dismiss Net Worth tooltip" title="Dismiss tooltip">✕</button><canvas id="chartNetWorth" role="img" aria-label="Net Worth history chart"></canvas></div>
  </div>

  <div class="section">
    <h2>Retirement vs Non-Retirement</h2>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="timeframe-bar" id="timeframeBarStacked" style="display:none;margin-bottom:0;"></div>
      <div style="display:flex;border:1px solid #30363d;border-radius:6px;overflow:hidden;flex-shrink:0;">
        <button id="segPie" aria-pressed="true" onclick="setStackedMode('pie')" style="background:#C9A961;color:#000;border:none;padding:4px 12px;font-size:0.78rem;cursor:pointer;">Pie</button>
        <button id="segBar" aria-pressed="false" onclick="setStackedMode('bar')" style="background:transparent;color:#8b949e;border:none;border-left:1px solid #30363d;padding:4px 12px;font-size:0.78rem;cursor:pointer;">Bar</button>
      </div>
    </div>
    <div class="chart-change" id="stackedChange" aria-live="polite" style="display:none;"></div>
    <div class="chart-wrapper"><button class="tt-dismiss" id="ttDismissStacked" onclick="dismissTooltip('stacked')" aria-label="Dismiss retirement tooltip" title="Dismiss tooltip">✕</button><canvas id="chartStacked" role="img" aria-label="Retirement and non-retirement history chart"></canvas></div>
  </div>

  <div class="section" id="projectionSection">
    <h2>Projections</h2>
    <div class="proj-scenario"><label for="projScenario">Scenario</label><select id="projScenario" aria-label="Projection scenario" onchange="applyScenario(this.value)"><option value="conservative">Conservative · 4%</option><option value="expected">Expected · 7%</option><option value="optimistic">Optimistic · 9%</option><option value="custom">Custom</option></select></div>
    <details class="advanced-settings" id="advancedProjection">
      <summary>Advanced settings</summary>
      <div class="proj-controls" id="projControls">
        <label>Growth <input type="number" id="projGrowth" min="0" max="15" step="0.5" inputmode="decimal" aria-label="Annual investment growth rate" value="7"> %/yr</label>
        <label>Horizon <input type="number" id="projHorizon" min="1" max="30" step="1" inputmode="numeric" aria-label="Projection horizon in years" value="10"> yr</label>
        <label>Income <input type="number" id="projIncome" min="0" max="1000" step="5" inputmode="decimal" aria-label="Gross annual income in thousands" value="400"> $K/yr</label>
        <label>Tax <input type="number" id="projTax" min="0" max="100" step="1" inputmode="decimal" aria-label="Tax rate" value="35"> %</label>
        <label>Expenses <input type="number" id="projExpenses" min="0" max="500" step="1" inputmode="decimal" aria-label="Annual expenses in thousands" value="108"> $K/yr</label>
        <label>Inflation <input type="number" id="projInflation" min="0" max="15" step="0.1" inputmode="decimal" aria-label="Annual inflation rate" value="3"> %/yr</label>
        <button type="button" onclick="resetProjectionDefaults()">Reset</button>
      </div>
    </details>
    <div class="chart-wrapper"><button class="tt-dismiss" id="ttDismissProj" onclick="dismissTooltip('projections')" aria-label="Dismiss projections tooltip" title="Dismiss tooltip">✕</button><canvas id="chartProjections" role="img" aria-label="Liquid net worth projection chart"></canvas></div>
  </div>

  <div class="section achievements-section">
    <div class="ach-header">
      <div>
        <h2>Achievements</h2>
        <div id="achSummary" class="ach-summary">Tracking your next financial milestones</div>
      </div>
      <button class="ach-toggle" aria-expanded="false" aria-controls="achPanel" onclick="toggleAchievements()">
        <span id="achToggleLabel">View details</span><span id="achCaret" aria-hidden="true">↓</span>
      </button>
    </div>
    <details class="trophy-case" id="trophyCase">
      <summary id="trophySummary">Trophy case</summary>
      <div id="trophyGrid" class="trophy-grid" aria-live="polite"></div>
    </details>
    <div id="achPanel" style="display:none;" aria-live="polite"></div>
  </div>
</div>

<script>
const DATA = {"series": {"dates": ["2025-12-01", "2026-01-01", "2026-02-01", "2026-03-01", "2026-04-01", "2026-05-01", "2026-06-01", "2026-07-01", "2026-08-01", "2026-09-01"], "net_worth_total": [1478756.92, 1528236.2800000003, 1496818.1099999999, 1530679.3599999999, 1642071.13, 1719610.3599999999, 1721304.1099999999, 1696533.3900000001, 1767541.31, 1765047.64], "net_worth_ex_housing": [870589.0, 915779.9900000001, 880066.0, 909623.99, 1016705.0099999999, 1089926.0, 1087294.0, 1058190.0, 1124857.09, 1118236.64], "retirement": [510363.18000000005, 536855.3800000001, 515918.86, 533246.56, 596020.3999999999, 638944.5599999999, 637401.6, 620340.04, 659422.12, 649414.6399999999], "non_retirement": [360225.82, 378924.61, 364147.14, 376377.43, 420684.61, 450981.44, 449892.4, 437849.96, 465434.97, 468822]}, "current": {"home_equity": 646811, "mortgage_balance": 564076, "income": 400000, "expenses": 108000}, "password": {"hash": "38e4b15c961f7bcd669f6a51ee52462a4afa56ecbcb2d96741757f4240463897", "salt": "a83e9bc8f5dd4e61ed356b0e125193d5"}, "password_enabled": true, "tooltip_mode": "dismiss-button", "projection_defaults": {"growth_rate": 7, "horizon_years": 10, "income_thousands": 400, "tax_rate": 35, "expenses_thousands": 108}, "retirement_profile": {"target_age": 42, "birth_year": 1995, "birth_month": 9, "fire_multiple": 25, "inflation_rate": 3}};
const DEFAULT_INFLATION = Number(DATA.retirement_profile?.inflation_rate ?? 3);
Chart.register(ChartDataLabels);

function sha256(str) {
  const encoder = new TextEncoder();
  return crypto.subtle.digest('SHA-256', encoder.encode(str))
    .then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''));
}
async function checkPassword() {
  const input = document.getElementById('pw-input').value;
  const hash = await sha256(DATA.password.salt + input);
  if (hash === DATA.password.hash) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('pw-error').textContent = 'Wrong password';
  }
}

const MODE = DATA.tooltip_mode || 'dismiss-button';
const CHART_KEYS = ['chartNetWorth','chartProjections','chartStacked'];
const CHART_MAP = { chartNetWorth:'nw', chartProjections:'projections', chartStacked:'stacked' };
const CC = { total: '#C9A961', exHousing: '#8fbf9f', retirement: '#d7a84b', nonRetirement: '#7aa2c8' };
const TOOLTIP_TIMEOUT_MS = 4000;
const tooltipTimers = {};

function dismissTooltip(key) {
  if (tooltipTimers[key]) { clearTimeout(tooltipTimers[key]); delete tooltipTimers[key]; }
  var c = charts[key];
  if (!c) return;
  try {
    // Clear all internal active states (handles both tap and drag-locked tooltips)
    c.setActiveElements([]);
    c.tooltip.setActiveElements([], {x:0,y:0});
    c.update('none');
  } catch(_) {}
  updateDismissButtons();
}

function updateDismissButtons() {
  if (MODE !== 'dismiss-button') return;
  var anyActive = false;
  CHART_KEYS.forEach(function(id) {
    var c = charts[CHART_MAP[id]];
    var active = c && c.tooltip && c.tooltip.getActiveElements().length > 0;
    var btnMap = { chartNetWorth:'ttDismissNW', chartProjections:'ttDismissProj', chartStacked:'ttDismissStacked' };
    var btn = document.getElementById(btnMap[id]);
    if (btn) {
      if (active) {
        btn.classList.add('visible'); anyActive = true;
        if (!tooltipTimers[CHART_MAP[id]]) {
          const key = CHART_MAP[id];
          tooltipTimers[key] = setTimeout(function() {
            delete tooltipTimers[key];
            dismissTooltip(key);
          }, TOOLTIP_TIMEOUT_MS);
        }
      } else {
        btn.classList.remove('visible');
        const key = CHART_MAP[id];
        if (tooltipTimers[key]) { clearTimeout(tooltipTimers[key]); delete tooltipTimers[key]; }
      }
    }
  });
}

// Periodic check for tooltip visibility (Chart.js doesn't expose show/hide events easily)
if (MODE === 'dismiss-button') {
  setInterval(updateDismissButtons, 300);
}

function fmtShort(n) {
  if (n == null || isNaN(n)) return 'N/A';
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (abs >= 1000) return (n / 1000).toFixed(0) + 'K';
  return n.toFixed(0);
}

const TF_MAIN = { '3M': 3, '6M': 6, 'YTD': 'ytd', '1Y': 12, '5Y': 60, 'All': 'all' };
function filterDates(dates, seriesArr, tf) {
  if (tf === 'all') return { dates, series: seriesArr };
  const lastDate = new Date(dates[dates.length - 1]);
  let cutoff;
  if (tf === 'ytd') { cutoff = new Date(lastDate.getFullYear(), 0, 1); }
  else { cutoff = new Date(lastDate); cutoff.setMonth(cutoff.getMonth() - tf); }
  const idx = [];
  dates.forEach((d, i) => { if (new Date(d) >= cutoff || i >= dates.length - 2) idx.push(i); });
  return { dates: idx.map(i => dates[i]), series: seriesArr.map(s => idx.map(i => s[i])) };
}

let charts = {};

// --- Projection engine ---
let projCache = null;
function calcProjections(income, expenses, taxRate, growthPct, horizonYears) {
  const s = DATA.series;
  const lastIdx = s.dates.length - 1;
  const liquidNW = s.net_worth_ex_housing[lastIdx];
  const horizonMonths = horizonYears * 12;
  const r = growthPct / 100, monthlyR = r / 12;
  const netSavings = Math.max(0, (income * 1000 * (1 - taxRate/100) - expenses * 1000) / 12);

  // Track two components: current NW compounding, and contributions + their growth
  const existing = [];    // current NW compounding without new money
  const contributions = []; // new contributions + their compounded growth
  const total = [];

  let nwExisting = liquidNW;
  let nwContrib = 0;

  for (let m = 0; m <= horizonMonths; m++) {
    existing.push(Math.round(nwExisting));
    contributions.push(Math.round(nwContrib));
    total.push(Math.round(nwExisting + nwContrib));
    // Grow existing NW
    nwExisting = nwExisting * (1 + monthlyR);
    // Grow existing contributions, then add this month's savings
    nwContrib = nwContrib * (1 + monthlyR) + netSavings;
  }

  const lastDate = new Date(s.dates[lastIdx]);
  const projDates = [];
  for (let m = 0; m <= horizonMonths; m++) { const d = new Date(lastDate); d.setMonth(d.getMonth()+m); projDates.push(d.toISOString().slice(0,10)); }
  return { projDates, existing, contributions, total, annualGrowth: growthPct };
}

const SCENARIOS = { conservative: 4, expected: 7, optimistic: 9 };
function applyScenario(name) {
  if (SCENARIOS[name] != null) document.getElementById('projGrowth').value = SCENARIOS[name];
  recalcProjections(name);
}
function markCustomScenario() {
  document.getElementById('projScenario').value = 'custom';
  recalcProjections('custom');
}
function recalcProjections(scenarioName) {
  const income = Math.max(0, Math.min(1000, parseFloat(document.getElementById('projIncome').value) || 0));
  const taxRate = Math.max(0, Math.min(100, parseFloat(document.getElementById('projTax').value) || 0));
  const expenses = Math.max(0, Math.min(500, parseFloat(document.getElementById('projExpenses').value) || 0));
  const growth = Math.max(0, Math.min(15, parseFloat(document.getElementById('projGrowth').value) || 0));
  const horizon = Math.max(1, Math.min(30, parseInt(document.getElementById('projHorizon').value) || 1));
  const inflation = Math.max(0, Math.min(15, parseFloat(document.getElementById('projInflation').value) || 0));
  const scenario = scenarioName || document.getElementById('projScenario').value || 'custom';
  DATA.retirement_profile.inflation_rate = inflation;
  localStorage.setItem('networth-projection-inputs', JSON.stringify({ income, taxRate, expenses, growth, horizon, inflation, scenario }));
  projCache = calcProjections(income, expenses, taxRate, growth, horizon);
  drawProjectionsFn();
  buildAchievementPanel();
}

function resetProjectionDefaults() {
  localStorage.removeItem('networth-projection-inputs');
  applyProjectionDefaults();
  recalcProjections();
}

function applyProjectionDefaults() {
  const d = DATA.projection_defaults || {};
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('networth-projection-inputs') || '{}'); } catch (_) {}
  document.getElementById('projGrowth').value = saved.growth ?? d.growth_rate ?? 7;

  document.getElementById('projScenario').value = savedScenario;
}

// --- Milestones ---
function getCurrentValues() {
  const s = DATA.series; const li = s.dates.length - 1;
  return {
    liquidNW: s.net_worth_ex_housing[li], totalNW: s.net_worth_total[li],
    retirement: s.retirement[li], nonRetirement: s.non_retirement[li],
    homeEquity: s.net_worth_total[li] - s.net_worth_ex_housing[li],
  };
}

function buildMilestones(proj) {
  const cur = getCurrentValues();
  const c = DATA.current || {};
  const expenses = c.expenses ?? 96000;
  function findCrossMonth(target) {
    for (let m = 0; m < proj.total.length; m++) { if (proj.total[m] >= target) return m; }
    return -1;
  }
  function crossDate(months) {
    if (months < 0) return null;
    const d = new Date(proj.projDates[months]);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
  }
  const milestones = [];
  [1e6, 2e6, 3e6, 4e6, 5e6, 7.5e6, 10e6].forEach(v => {
    const pct = cur.liquidNW / v;
    const m = findCrossMonth(v);
    milestones.push({ type: 'liquid', name: '$' + fmtShort(v) + ' liquid', value: v, current: cur.liquidNW, pct, crossMonths: m, crossDate: crossDate(m), status: cur.liquidNW >= v ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  const piMillion = Math.PI * 1e6;
  const piPct = cur.liquidNW / piMillion;
  const piCrossMonths = findCrossMonth(piMillion);
  milestones.push({ type: 'fun', name: 'π million liquid', value: piMillion, desc: 'The π milestone · $3,141,592.65 liquid', current: cur.liquidNW, pct: piPct, crossMonths: piCrossMonths, crossDate: crossDate(piCrossMonths), status: cur.liquidNW >= piMillion ? 'done' : (piPct >= 0.75 ? 'close' : 'far') });
  const phiMillion = ((1 + Math.sqrt(5)) / 2) * 1e6;
  const phiPct = cur.liquidNW / phiMillion;
  const phiCrossMonths = findCrossMonth(phiMillion);
  milestones.push({ type: 'fun', name: 'φ million liquid', value: phiMillion, desc: 'The golden-ratio milestone · $1,618,033.99 liquid', current: cur.liquidNW, pct: phiPct, crossMonths: phiCrossMonths, crossDate: crossDate(phiCrossMonths), status: cur.liquidNW >= phiMillion ? 'done' : (phiPct >= 0.75 ? 'close' : 'far') });
  const eMillion = Math.E * 1e6;
  const ePct = cur.liquidNW / eMillion;
  const eCrossMonths = findCrossMonth(eMillion);
  milestones.push({ type: 'fun', name: 'e million liquid', value: eMillion, desc: "Euler's-number milestone · $2,718,281.83 liquid", current: cur.liquidNW, pct: ePct, crossMonths: eCrossMonths, crossDate: crossDate(eCrossMonths), status: cur.liquidNW >= eMillion ? 'done' : (ePct >= 0.75 ? 'close' : 'far') });
  const number1234567 = 1234567;
  const number1234567Pct = cur.liquidNW / number1234567;
  const number1234567CrossMonths = findCrossMonth(number1234567);
  milestones.push({ type: 'fun', name: '$1,234,567 liquid', value: number1234567, desc: 'The 1-2-3-4-5-6-7 milestone', current: cur.liquidNW, pct: number1234567Pct, crossMonths: number1234567CrossMonths, crossDate: crossDate(number1234567CrossMonths), status: cur.liquidNW >= number1234567 ? 'done' : (number1234567Pct >= 0.75 ? 'close' : 'far') });
  if (DATA.current && DATA.current.mortgage_balance != null) {
    const totalHome = cur.homeEquity + DATA.current.mortgage_balance;
    [0.50, 0.75, 1.0].forEach(pct => {
      const curPct = totalHome > 0 ? cur.homeEquity / totalHome : 0;
      milestones.push({ type: 'home', name: (pct*100).toFixed(0) + '% home equity', value: totalHome * pct, current: cur.homeEquity, pct: curPct / pct, crossMonths: -1, crossDate: null, status: curPct >= pct ? 'done' : (curPct >= pct*0.75 ? 'close' : 'far') });
    });
    const mortgageBalance = Number(DATA.current.mortgage_balance);
    const mortgagePct = mortgageBalance > 0 ? cur.liquidNW / mortgageBalance : 1;
    milestones.push({ type: 'home', name: 'Liquid assets exceed mortgage', value: mortgageBalance, desc: 'Current tracked liquid investments exceed the mortgage balance owed', current: cur.liquidNW, pct: mortgagePct, crossMonths: -1, crossDate: null, status: cur.liquidNW >= mortgageBalance ? 'done' : (mortgagePct >= 0.75 ? 'close' : 'far') });
    const homeEquityPct = cur.homeEquity > 0 ? cur.liquidNW / cur.homeEquity : 1;
    milestones.push({ type: 'home', name: 'Investments exceed home equity', value: cur.homeEquity, desc: 'Current tracked liquid investments exceed current home equity', current: cur.liquidNW, pct: homeEquityPct, crossMonths: -1, crossDate: null, status: cur.liquidNW >= cur.homeEquity ? 'done' : (homeEquityPct >= 0.75 ? 'close' : 'far') });
  }
  const profile = DATA.retirement_profile || {};
  const fireMultiple = profile.fire_multiple ?? 25;
  const coastAge = Number(profile.target_age);
  const birthYear = Number(profile.birth_year);
  const birthMonth = Number(profile.birth_month);
  const coastValid = coastAge > 0 && birthYear > 0 && birthMonth >= 1 && birthMonth <= 12;
  const coastDate = coastValid ? new Date(Date.UTC(birthYear + coastAge, birthMonth - 1, 1)) : null;
  const snapshotDate = new Date(DATA.series.dates[DATA.series.dates.length - 1] + 'T00:00:00Z');
  const coastMonths = coastValid ? Math.max(0, (coastDate.getUTCFullYear() - snapshotDate.getUTCFullYear()) * 12 + coastDate.getUTCMonth() - snapshotDate.getUTCMonth()) : 0;
  const annualGrowth = Number(proj.annualGrowth || 0) / 100;
  const monthlyGrowth = annualGrowth / 12;
  const inflationMonthly = Number(profile.inflation_rate ?? 3) / 100 / 12;
  const coastFactor = Math.pow(1 + monthlyGrowth, coastMonths);
  const coastTarget = expenses * fireMultiple * Math.pow(1 + inflationMonthly, coastMonths);
  const coastRequiredToday = coastFactor > 0 ? coastTarget / coastFactor : coastTarget;
  const coastLabel = coastValid ? 'Coast FIRE · age ' + coastAge : 'Coast FIRE';
  const coastDesc = coastValid ? 'Retirement assets needed today to reach ' + fireMultiple + 'x expenses by age ' + coastAge : 'Retirement assets grow toward financial independence';
  const coastPct = coastRequiredToday > 0 ? cur.retirement / coastRequiredToday : 0;
  milestones.push({ type: 'fire', isCoast: true, name: coastLabel, value: coastRequiredToday, desc: coastDesc, current: cur.retirement, pct: coastPct, crossMonths: coastPct >= 1 ? 0 : -1, crossDate: coastPct >= 1 && coastDate ? coastDate.toLocaleDateString('en-US', { year: 'numeric', month: 'short' }) : null, status: coastPct >= 1 ? 'done' : (coastPct >= 0.75 ? 'close' : 'far') });
  [{ name: 'Lean FIRE', mult: 25, desc: '25x annual expenses · 4.0% withdrawal rate' },{ name: 'Full FIRE', mult: 33, desc: '33x expenses · 3.0% withdrawal rate' },{ name: 'Fat FIRE', mult: 40, desc: '40x expenses · 2.5% withdrawal rate' }].forEach(ft => {
    const target = expenses * ft.mult;
    const pct = cur.liquidNW / target;
    const m = findCrossMonth(target);
    milestones.push({ type: 'fire', name: ft.name, value: target, desc: ft.desc, current: cur.liquidNW, pct, crossMonths: m, crossDate: crossDate(m), status: cur.liquidNW >= target ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  const bridgeInflation = inflationMonthly;
  const bridgeSnapshotDate = new Date(DATA.series.dates[DATA.series.dates.length - 1] + 'T00:00:00Z');
  const bridgeTargetDate = new Date(Date.UTC(Number(profile.birth_year) + Number(profile.target_age), Number(profile.birth_month) - 1, 1));
  const monthsToRetirement = Number.isFinite(bridgeTargetDate.getTime()) ? Math.max(0, (bridgeTargetDate.getUTCFullYear() - bridgeSnapshotDate.getUTCFullYear()) * 12 + bridgeTargetDate.getUTCMonth() - bridgeSnapshotDate.getUTCMonth()) : 0;
  const monthlyReturn = Number(proj.annualGrowth || 0) / 100 / 12;
  function bridgeTargetToday(years) {
    let target = 0;
    for (let k = 1; k <= Math.round(years * 12); k++) {
      const withdrawal = expenses / 12 * Math.pow(1 + bridgeInflation, monthsToRetirement + k - 1);
      target += withdrawal / Math.pow(1 + monthlyReturn, monthsToRetirement + k);
    }
    return target;
  }
  let bridgeYearsCovered = 0;
  if (cur.nonRetirement > 0) {
    let low = 0, high = 50;
    for (let i = 0; i < 24; i++) {
      const mid = (low + high) / 2;
      if (bridgeTargetToday(mid) <= cur.nonRetirement) low = mid;
      else high = mid;
    }
    bridgeYearsCovered = low;
  }
  [1, 3, 5, 10, 15, 20].forEach(yrs => {
    const target = bridgeTargetToday(yrs);
    const pct = target > 0 ? cur.nonRetirement / target : 0;
    milestones.push({ type: 'bridge', name: yrs + '-year bridge', value: target, desc: yrs + ' years of inflation-adjusted monthly expenses', current: cur.nonRetirement, pct, crossMonths: -1, crossDate: null, status: cur.nonRetirement >= target ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  DATA.bridgeYearsCovered = bridgeYearsCovered;
  return milestones;
}

function buildAchievementPanel() {
  if (!projCache) return;
  const milestones = buildMilestones(projCache);
  const panel = document.getElementById('achPanel');
  if (!panel) return;

  const completed = milestones.filter(m => m.status === 'done').length;
  const trophySummary = document.getElementById('trophySummary');
  const trophyGrid = document.getElementById('trophyGrid');
  if (trophySummary && trophyGrid) {
    trophySummary.textContent = 'Trophy case · ' + completed + ' collected';
    const trophyItems = milestones.filter(m => m.status === 'done').sort((a, b) => a.type.localeCompare(b.type) || a.value - b.value);
    trophyGrid.innerHTML = trophyItems.length
      ? trophyItems.map(m => '<span class="trophy-chip" title="' + m.name + '">✓ ' + m.name + '</span>').join('')
      : '<span class="trophy-empty">No achievements collected yet</span>';
  }
  const pending = milestones.filter(m => m.status !== 'done').sort((a, b) => b.pct - a.pct);
  const summary = document.getElementById('achSummary');
  if (summary) {
    const next = pending[0];
    summary.textContent = completed + ' of ' + milestones.length + ' complete' + (next ? ' · Next: ' + next.name : ' · All milestones reached');
  }

  const groups = [
    { key: 'liquid', title: 'Liquid net worth', icon: '◆' },
    { key: 'fire', title: 'FIRE milestones', icon: '✦' },
    { key: 'bridge', title: 'Bridge fund', icon: '→' },
    { key: 'home', title: 'Home & balance', icon: '⌂' },
    { key: 'fun', title: 'Fun milestones', icon: 'π' },

  ];

  const explanations = {
    liquid: 'Liquid net worth excludes home equity and mortgage value. Checking and savings are intentionally excluded; current liquid assets are the tracked investment accounts.',
    fire: 'Coast FIRE uses retirement assets only and inflates the age-42 target. Lean, Full, and Fat FIRE use 25x, 33x, and 40x expenses (4.0%, 3.0%, and 2.5% withdrawal rates); these are planning heuristics, not guarantees.',
    bridge: 'Uses inflation-adjusted monthly expenses and the selected scenario return. At the current non-retirement balance, the modeled bridge covers roughly ' + (Number(DATA.bridgeYearsCovered || 0)).toFixed(1) + ' years.',
    home: 'Home equity is estimated home value minus the remaining mortgage. The related milestones compare current tracked liquid investments with the mortgage balance owed and home equity.',
    fun: 'Just-for-fun milestones use the same liquid net worth and projection calculations as the main tracker.',

  };
  let html = '<div class="achievement-grid">';
  groups.forEach(g => {
    const items = milestones.filter(m => m.type === g.key).sort((a, b) => a.value - b.value);
    if (!items.length) return;
    const candidateItems = items;
    const featured = candidateItems.filter(m => m.status !== 'done').sort((a, b) => (a.isCoast ? -1 : b.isCoast ? 1 : b.pct - a.pct))[0] || items[0];
    const pct = Math.min(100, Math.max(0, featured.pct * 100));
    const cls = featured.status === 'done' ? 'done' : (featured.status === 'close' ? 'close' : 'far');
    const status = featured.status === 'done' ? 'Complete' : (featured.status === 'close' ? 'Next up' : 'In progress');
    const desc = g.key === 'bridge'
      ? featured.desc + ' · ~' + Number(DATA.bridgeYearsCovered || 0).toFixed(1) + ' years currently covered'
      : (featured.desc || ('Target: $' + fmtShort(featured.value)));
    const target = '$' + fmtShort(featured.value);
    const current = '$' + fmtShort(featured.current);
    const dateText = featured.crossDate ? 'Est. ' + featured.crossDate : (featured.status === 'done' ? 'Completed' : 'Not projected yet');
    html += '<article class="achievement-card featured ' + cls + '">';
    html += '<div class="achievement-card-head"><div><div class="achievement-card-title">' + g.icon + ' ' + g.title + '</div><div class="achievement-card-category">' + (featured.name === g.title ? '' : featured.name) + '</div></div><div class="achievement-status ' + cls + '">' + status + '</div></div>';
    html += '<div class="achievement-description">' + desc + '</div>';
    html += '<details class="achievement-explainer"><summary>How is this calculated?</summary><p>' + explanations[g.key] + '</p></details>';
    html += '<div class="achievement-progress" role="progressbar" aria-label="' + featured.name + ' progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct.toFixed(0) + '"><div class="achievement-progress-fill ' + cls + '" style="width:' + pct + '%"></div><span class="achievement-progress-percent">' + pct.toFixed(0) + '%</span></div>';
    html += '<div class="achievement-card-foot"><span>' + current + ' of ' + target + '</span><span class="' + (dateText === 'Not projected yet' ? 'no-date' : '') + '">' + dateText + '</span></div>';
    html += '<div class="achievement-ladder" aria-label="' + g.title + ' milestones">';
    items.forEach(m => {
        const itemClass = (m.status === 'done' ? 'done' : (m === featured ? 'current' : 'far'));
      const state = m.status === 'done' ? 'Completed' : (m === featured ? 'Current focus' : 'Future milestone');
      const mark = m.status === 'done' ? '✓' : (m === featured ? '◆' : '·');
      html += '<span class="achievement-ladder-item ' + itemClass + '" aria-label="' + m.name + ': ' + state + '" title="' + state + '"><b>' + mark + '</b> ' + m.name.replace(' liquid', '') + '</span>';
    });
    html += '</div></article>';
  });
  html += '</div>';
  panel.innerHTML = html;
}

function toggleAchievements() {
  const panel = document.getElementById('achPanel');
  const caret = document.getElementById('achCaret');
  const open = panel.style.display === 'none';
  panel.style.display = open ? 'block' : 'none';
  caret.textContent = open ? '↑' : '↓';
  document.getElementById('achToggleLabel').textContent = open ? 'Hide details' : 'View details';
  document.querySelector('.ach-toggle').setAttribute('aria-expanded', open);
  localStorage.setItem('networth-achievements-open', String(open));
  if (open) buildAchievementPanel();
}

// --- Main ---
function initDashboard() {
  const s = DATA.series;
  const li = s.dates.length - 1;
  const pi = Math.max(0, li - 1);
  const nw = s.net_worth_total[li];
  const nwPrev = s.net_worth_total[pi];
  const deltaNW = nw - nwPrev;
  const deltaPctNW = nwPrev > 0 ? (deltaNW / nwPrev * 100) : 0;

  const liquid = s.net_worth_ex_housing[li];
  const liquidPrev = s.net_worth_ex_housing[pi];
  const deltaLiquid = liquid - liquidPrev;
  const deltaPctLiquid = liquidPrev > 0 ? (deltaLiquid / liquidPrev * 100) : 0;

  const ret = s.retirement[li];
  const retPrev = s.retirement[pi];
  const deltaRet = ret - retPrev;
  const deltaPctRet = retPrev > 0 ? (deltaRet / retPrev * 100) : 0;

  document.getElementById('dateRange').textContent = 'Latest: ' + s.dates[li] + ' · ' + s.dates[0] + ' → ' + s.dates[li];
  document.getElementById('statsRow').innerHTML = [
    { l: 'Net Worth', v: '$'+fmtShort(nw), d: (deltaNW>=0?'+':'')+'$'+fmtShort(Math.abs(deltaNW))+' ('+(deltaPctNW>=0?'+':'')+deltaPctNW.toFixed(1)+'%)', pos: deltaNW>=0 },
    { l: 'Liquid NW', v: '$'+fmtShort(liquid), d: (deltaLiquid>=0?'+':'')+'$'+fmtShort(Math.abs(deltaLiquid))+' ('+(deltaPctLiquid>=0?'+':'')+deltaPctLiquid.toFixed(1)+'%)', pos: deltaLiquid>=0 },
    { l: 'Retirement', v: '$'+fmtShort(ret), d: (deltaRet>=0?'+':'')+'$'+fmtShort(Math.abs(deltaRet))+' ('+(deltaPctRet>=0?'+':'')+deltaPctRet.toFixed(1)+'%)', pos: deltaRet>=0 },
    { l: 'Snapshots', v: String(s.dates.length), d: '', pos: true },
  ].map(st => '<div class="stat-box"><div class="label">'+st.l+'</div><div class="value">'+st.v+'</div>'+(st.d?'<div class="delta '+(st.pos?'pos':'neg')+'">'+st.d+'</div>':'')+'</div>').join('');

  destroyAllCharts();
  makeTFBar('timeframeBarNW', 'nw', TF_MAIN, drawNW);
  drawNW();
  applyProjectionDefaults();
  ['projHorizon','projIncome','projTax','projExpenses','projInflation'].forEach(id => {
    document.getElementById(id).addEventListener('input', recalcProjections);
  });
  document.getElementById('projGrowth').addEventListener('input', markCustomScenario);
  recalcProjections();
  makeTFBar('timeframeBarStacked', 'stacked', TF_MAIN, drawStackedOrPie);
  drawStackedOrPie();
  if (localStorage.getItem('networth-achievements-open') === 'true') toggleAchievements();
}

(function() {
  if (!DATA.password_enabled) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  }
})();

// --- Tooltip workarounds (only active in 'workaround' mode) ---
if (MODE === 'workaround') {
  // tap outside canvas dismisses tooltips
  document.addEventListener('click', function(e) {
    if (!e.target.closest('canvas')) {
      Object.values(charts).forEach(c => {
        try { if (c && c.tooltip) c.tooltip.setActiveElements([], {x:0,y:0}); } catch(_) {}
      });
    }
  });

  // second tap on same canvas toggles tooltip off
  document.addEventListener('click', function(e) {
    var canvas = e.target.closest('canvas');
    if (!canvas) return;
    var chart = charts[CHART_MAP[canvas.id]];
    if (!chart || !chart.tooltip) return;
    var active = chart.tooltip.getActiveElements();
    if (active && active.length) {
      chart.tooltip.setActiveElements([], {x:0,y:0});
    }
  }, true);

  // force-hide after touch end (fixes stuck tooltip after drag)
  document.addEventListener('touchend', function(e) {
    var canvas = e.target.closest('canvas');
    if (!canvas) return;
    var chart = charts[CHART_MAP[canvas.id]];
    if (!chart) return;
    setTimeout(function() {
      try { chart.tooltip.setActiveElements([], {x:0,y:0}); } catch(_) {}
    }, 50);
  });
}
</script>

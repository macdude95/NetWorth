<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Net Worth Dashboard</title>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/chartjs-plugin-datalabels.min.js"></script>
  <script src="vendor/chartjs-plugin-annotation.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000; color: #c9d1d9; padding: 12px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: #f0f6fc; }
    .subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 16px; }
    .section { margin-bottom: 28px; }
    .section h2 { font-size: 1.05rem; color: #f0f6fc; margin-bottom: 10px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
    .chart-wrapper { position: relative; width: 100%; background: #0b0b0b; border: 1px solid #27231a; border-radius: 8px; padding: 12px; }
    canvas { width: 100% !important; max-height: 350px; }
    .timeframe-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .timeframe-bar button {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer;
      transition: background 0.15s;
    }
    .timeframe-bar button.active { background: #C9A961; border-color: #C9A961; color: #000; }
    .timeframe-bar button:hover { background: #30363d; }
    .stats-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .stat-box {
      flex: 1 1 120px; background: #0b0b0b; border: 1px solid #27231a; border-radius: 8px;
      padding: 10px 12px; text-align: center; min-width: 110px;
    }
    .stat-box .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
    .stat-box .value { font-size: 1.2rem; font-weight: 700; color: #f0f6fc; }
    .stat-box .delta { font-size: 0.7rem; margin-top: 2px; }
    .delta.pos { color: #3fb950; } .delta.neg { color: #f85149; }
    #gate {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 70vh;
    }
    #gate form { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 280px; width: 100%; }
    #gate input[type="password"] {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d;
      background: #000; color: #f0f6fc; font-size: 1rem; outline: none;
    }
    #gate input[type="password"]:focus { border-color: #C9A961; }
    #gate button {
      width: 100%; padding: 10px; background: #C9A961; color: #000;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    #gate .error { color: #f85149; font-size: 0.85rem; margin-top: 4px; min-height: 20px; }
    #dashboard { display: none; }
    .proj-controls {
      background: #0b0b0b; border: 1px solid #27231a; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .proj-controls label {
      display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; color: #8b949e;
      text-transform: uppercase; min-width: 100px; flex: 1 1 130px;
    }
    .proj-controls input { 
      background: #000; border: 1px solid #30363d; border-radius: 6px;
      padding: 6px 8px; color: #f0f6fc; font-size: 0.85rem; width: 100%;
    }
    .proj-controls input:focus { border-color: #C9A961; outline: none; }
    .proj-controls button {
      background: #C9A961; color: #000; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 0.8rem; cursor: pointer; margin-top: 8px;
    }
    .proj-controls button:hover { background: #2ea043; }
    .tt-dismiss {
      display: inline-flex; align-items: center; justify-content: center;
      position: absolute; top: 10px; right: 10px; z-index: 10;
      width: 44px; height: 44px; background: rgba(0,0,0,0.82); color: #C9A961;
      border: 1px solid #C9A961; border-radius: 50%; padding: 0;
      font-size: 1.15rem; font-weight: 500; cursor: pointer; line-height: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35); transition: transform 0.15s, background 0.15s;
    }
    .tt-dismiss:hover, .tt-dismiss:focus-visible { background: #C9A961; color: #000; transform: scale(1.06); outline: none; }
    .tt-dismiss.visible { display: inline-flex; }
    .seg-control { display: flex; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .seg-control button {
      background: transparent; color: #8b949e; border: none;
      padding: 4px 12px; font-size: 0.78rem; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .seg-control button:first-child { border-right: 1px solid #30363d; }
    .seg-control button.active { background: #C9A961; color: #000; }
    .ach-toggle {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
      margin-bottom: 12px; width: 100%; text-align: left; display: flex;
      justify-content: space-between; align-items: center;
    }
    .ach-toggle:hover { background: #30363d; }
    .ach-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .ach-table td { padding: 7px 10px; border-bottom: 1px solid #21262d; vertical-align: middle; }
    .ach-table tr:last-child td { border-bottom: none; }
    .ach-table .ach-icon { font-size: 1rem; width: 28px; text-align: center; }
    .ach-table .ach-label { }
    .ach-table .ach-bar { width: 100%; min-width: 80px; }
    .ach-table .ach-pct { text-align: right; min-width: 42px; font-size: 0.75rem; }
    .ach-table .ach-date { text-align: right; min-width: 75px; font-size: 0.72rem; color: #8b949e; }
    .ach-table .ach-done { color: #3fb950; }
    .ach-table .ach-close { color: #d29922; }
    .ach-table .ach-far { color: #8b949e; }
    .ach-bar-bg { width: 100%; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
    .ach-bar-fill { height: 100%; border-radius: 3px; max-width: 100%; }
    .ach-bar-fill.done { background: #3fb950; }
    .ach-bar-fill.close { background: #d29922; }
    .ach-bar-fill.far { background: #30363d; }
    .ach-group-title { font-size: 0.72rem; color: #8b949e; text-transform: uppercase; padding: 10px 10px 4px; letter-spacing: 0.5px; }
    .ach-header { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .ach-header h2 { margin-bottom: 4px; }
    .ach-summary { color: #C9A961; font-size: 0.8rem; }
    .ach-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; width: auto; margin-bottom: 0; background: #C9A961; color: #000; border: 0; border-radius: 999px; padding: 8px 13px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .ach-toggle:hover, .ach-toggle:focus-visible { background: #ead18d; outline: 2px solid #C9A961; outline-offset: 2px; }
    .achievement-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .achievement-card { background: #0b0b0b; border: 1px solid #27231a; border-radius: 10px; padding: 13px; min-width: 0; }
    .achievement-card.done { border-color: rgba(105,219,124,0.55); }
    .achievement-card.close { border-color: rgba(215,168,75,0.65); }
    .achievement-card-head { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
    .achievement-card-title { color: #f0f6fc; font-size: 0.88rem; font-weight: 650; }
    .achievement-card-category { color: #8b949e; font-size: 0.68rem; margin-top: 2px; }
    .achievement-status { font-size: 0.68rem; font-weight: 700; white-space: nowrap; }
    .achievement-status.done { color: #69db7c; }
    .achievement-status.close { color: #d7a84b; }
    .achievement-status.far { color: #8b949e; }
    .achievement-description { color: #8b949e; font-size: 0.72rem; line-height: 1.35; margin: 10px 0 9px; min-height: 1.9em; }
    .achievement-progress { height: 8px; background: #21262d; border-radius: 5px; overflow: hidden; }
    .achievement-progress-fill { height: 100%; border-radius: 5px; background: #8b949e; }
    .achievement-progress-fill.done { background: #69db7c; }
    .achievement-progress-fill.close { background: #d7a84b; }
    .achievement-card-foot { display: flex; justify-content: space-between; gap: 8px; color: #b8b8b8; font-size: 0.7rem; margin-top: 7px; }
    .achievement-card-foot span:last-child { color: #a9a9a9; text-align: right; }
    .achievement-card-foot .no-date { color: #c9c9c9; }
    @media (max-width: 480px) {
      .achievement-grid { grid-template-columns: 1fr; }
      .ach-header { align-items: start; }
      .ach-toggle { padding: 8px 11px; }
    }
    @media (max-width: 480px) {
      body { padding: 8px; }
      .stats-row { gap: 6px; }
      .stat-box { flex: 1 1 90px; min-width: 80px; padding: 8px; }
      .stat-box .value { font-size: 1rem; }
      .proj-controls { gap: 8px; }
      .proj-controls label { min-width: 80px; flex: 1 1 100px; }
    }
  </style>
</head>
<body>
<div id="gate">
  <form onsubmit="event.preventDefault(); checkPassword(); return false;">
    <h1 style="text-align:center;margin-bottom:8px;">🔒 Net Worth</h1>
    <input type="password" id="pw-input" placeholder="Enter password" autocomplete="current-password" aria-label="Dashboard password" autofocus>
    <button type="submit">Unlock</button>
    <div class="error" id="pw-error" role="alert" aria-live="polite"></div>
  </form>
</div>

<div id="dashboard" class="container">
  <h1>💰 Net Worth Dashboard</h1>
  <div class="subtitle" id="dateRange"></div>
  <div class="stats-row" id="statsRow"></div>

  <div class="section">
    <h2>Net Worth</h2>
    <div class="timeframe-bar" id="timeframeBarNW"></div>
    <div class="chart-wrapper"><button class="tt-dismiss" id="ttDismissNW" onclick="dismissTooltip('nw')" aria-label="Dismiss Net Worth tooltip" title="Dismiss tooltip">✕</button><canvas id="chartNetWorth" role="img" aria-label="Net Worth history chart"></canvas></div>
  </div>

  <div class="section" id="projectionSection">
    <h2>Projections</h2>
    <div class="proj-controls" id="projControls">
      <label>Growth <input type="number" id="projGrowth" min="0" max="15" step="0.5" inputmode="decimal" aria-label="Annual investment growth rate" value="7"> %/yr</label>
      <label>Horizon <input type="number" id="projHorizon" min="1" max="30" step="1" inputmode="numeric" aria-label="Projection horizon in years" value="10"> yr</label>
      <label>Income <input type="number" id="projIncome" min="0" max="1000" step="5" inputmode="decimal" aria-label="Gross annual income in thousands" value="400"> $K/yr</label>
      <label>Tax <input type="number" id="projTax" min="0" max="100" step="1" inputmode="decimal" aria-label="Tax rate" value="35"> %</label>
      <label>Expenses <input type="number" id="projExpenses" min="0" max="500" step="1" inputmode="decimal" aria-label="Annual expenses in thousands" value="108"> $K/yr</label>
      <button type="button" onclick="resetProjectionDefaults()">Reset</button>
    </div>
    <div class="chart-wrapper"><button class="tt-dismiss" id="ttDismissProj" onclick="dismissTooltip('projections')" aria-label="Dismiss projections tooltip" title="Dismiss tooltip">✕</button><canvas id="chartProjections" role="img" aria-label="Liquid net worth projection chart"></canvas></div>
  </div>

  <div class="section">
    <h2>Retirement vs Non-Retirement</h2>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="timeframe-bar" id="timeframeBarStacked" style="margin-bottom:0;"></div>
      <div style="display:flex;border:1px solid #30363d;border-radius:6px;overflow:hidden;flex-shrink:0;">
        <button id="segBar" aria-pressed="true" onclick="setStackedMode('bar')" style="background:#C9A961;color:#000;border:none;padding:4px 12px;font-size:0.78rem;cursor:pointer;">Bar</button>
        <button id="segPie" aria-pressed="false" onclick="setStackedMode('pie')" style="background:transparent;color:#8b949e;border:none;border-left:1px solid #30363d;padding:4px 12px;font-size:0.78rem;cursor:pointer;">Pie</button>
      </div>
    </div>
    <div class="chart-wrapper"><button class="tt-dismiss" id="ttDismissStacked" onclick="dismissTooltip('stacked')" aria-label="Dismiss retirement tooltip" title="Dismiss tooltip">✕</button><canvas id="chartStacked" role="img" aria-label="Retirement and non-retirement history chart"></canvas></div>
  </div>

  <div class="section achievements-section">
    <div class="ach-header">
      <div>
        <h2>Achievements</h2>
        <div id="achSummary" class="ach-summary">Tracking your next financial milestones</div>
      </div>
      <button class="ach-toggle" aria-expanded="false" aria-controls="achPanel" onclick="toggleAchievements()">
        <span id="achToggleLabel">View details</span><span id="achCaret" aria-hidden="true">↓</span>
      </button>
    </div>
    <div id="achPanel" style="display:none;" aria-live="polite"></div>
  </div>
</div>

<script>
const DATA = __CHART_DATA_JSON__;
Chart.register(ChartDataLabels);

function sha256(str) {
  const encoder = new TextEncoder();
  return crypto.subtle.digest('SHA-256', encoder.encode(str))
    .then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''));
}
async function checkPassword() {
  const input = document.getElementById('pw-input').value;
  const hash = await sha256(DATA.password.salt + input);
  if (hash === DATA.password.hash) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('pw-error').textContent = 'Wrong password';
  }
}

const MODE = DATA.tooltip_mode || 'dismiss-button';
const CHART_KEYS = ['chartNetWorth','chartProjections','chartStacked'];
const CHART_MAP = { chartNetWorth:'nw', chartProjections:'projections', chartStacked:'stacked' };
const CC = { total: '#C9A961', exHousing: '#8fbf9f', retirement: '#d7a84b', nonRetirement: '#7aa2c8' };

function dismissTooltip(key) {
  var c = charts[key];
  if (!c) return;
  try {
    // Clear all internal active states (handles both tap and drag-locked tooltips)
    c.setActiveElements([]);
    c.tooltip.setActiveElements([], {x:0,y:0});
    c.update('none');
  } catch(_) {}
  updateDismissButtons();
}

function updateDismissButtons() {
  if (MODE !== 'dismiss-button') return;
  var anyActive = false;
  CHART_KEYS.forEach(function(id) {
    var c = charts[CHART_MAP[id]];
    var active = c && c.tooltip && c.tooltip.getActiveElements().length > 0;
    var btnMap = { chartNetWorth:'ttDismissNW', chartProjections:'ttDismissProj', chartStacked:'ttDismissStacked' };
    var btn = document.getElementById(btnMap[id]);
    if (btn) {
      if (active) { btn.classList.add('visible'); anyActive = true; }
      else btn.classList.remove('visible');
    }
  });
}

// Periodic check for tooltip visibility (Chart.js doesn't expose show/hide events easily)
if (MODE === 'dismiss-button') {
  setInterval(updateDismissButtons, 300);
}

function fmtShort(n) {
  if (n == null || isNaN(n)) return 'N/A';
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (abs >= 1000) return (n / 1000).toFixed(0) + 'K';
  return n.toFixed(0);
}

const TF_MAIN = { 'YTD': 'ytd', '1Y': 12, '5Y': 60, 'All': 'all' };
function filterDates(dates, seriesArr, tf) {
  if (tf === 'all') return { dates, series: seriesArr };
  const lastDate = new Date(dates[dates.length - 1]);
  let cutoff;
  if (tf === 'ytd') { cutoff = new Date(lastDate.getFullYear(), 0, 1); }
  else { cutoff = new Date(lastDate); cutoff.setMonth(cutoff.getMonth() - tf); }
  const idx = [];
  dates.forEach((d, i) => { if (new Date(d) >= cutoff || i >= dates.length - 2) idx.push(i); });
  return { dates: idx.map(i => dates[i]), series: seriesArr.map(s => idx.map(i => s[i])) };
}

let charts = {};
let tfState = { nw: 'All', stacked: 'All' };

function makeTFBar(parentId, key, labels, redraw) {
  const bar = document.getElementById(parentId);
  bar.innerHTML = '';
  Object.keys(labels).forEach(l => {
    const btn = document.createElement('button');
    btn.textContent = l; btn.className = tfState[key] === l ? 'active' : '';
    btn.setAttribute('aria-pressed', tfState[key] === l);
    btn.onclick = () => { tfState[key] = l; bar.querySelectorAll('button').forEach(b => { b.className = ''; b.setAttribute('aria-pressed', 'false'); }); btn.className = 'active'; btn.setAttribute('aria-pressed', 'true'); redraw(); };
    bar.appendChild(btn);
  });
}

function baseOpts() {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#8b949e', font: { size: 11 } } }, datalabels: { display: false } },
    scales: {
      x: { ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8, callback: function(value) { const raw = this.getLabelForValue(value); const d = new Date(raw); return isNaN(d) ? raw : d.toLocaleDateString('en-US', {month:'short', year:'2-digit'}); } } },
      y: { ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtShort(v) }, grid: { color: 'rgba(201,209,217,0.1)' }, min: 0 }
    },
    interaction: { intersect: false, mode: 'index' },
  };
}

function drawNW() {
  if (charts.nw) { charts.nw.destroy(); charts.nw = null; }
  const f = filterDates(DATA.series.dates, [DATA.series.net_worth_total, DATA.series.net_worth_ex_housing], TF_MAIN[tfState.nw]);
  charts.nw = new Chart(document.getElementById('chartNetWorth'), {
    type: 'line', data: { labels: f.dates, datasets: [
      { label: 'Total (incl. home)', data: f.series[0], borderColor: CC.total, backgroundColor: 'rgba(31,111,235,0.1)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 },
      { label: 'Liquid (excl. home)', data: f.series[1], borderColor: CC.exHousing, borderDash: [5,3], fill: false, tension: 0.3, pointRadius: 2, borderWidth: 2 },
    ]}, options: baseOpts(),
  });
}

function drawProjectionsFn() {
  if (!projCache) recalcProjections();
  const p = projCache;
  if (charts.projections) { charts.projections.destroy(); charts.projections = null; }

  // Build milestone annotations
  const annotations = {};
  const milestones = [1e6, 2e6, 3e6, 4e6, 5e6, 7.5e6, 10e6];
  milestones.forEach((v, i) => {
    let crossIdx = -1;
    for (let m = 0; m < p.total.length; m++) {
      if (p.total[m] >= v) { crossIdx = m; break; }
    }
    if (crossIdx < 0) return;
    annotations['m' + i] = {
      type: 'line',
      xMin: crossIdx, xMax: crossIdx,
      borderColor: i === 0 ? '#3fb950' : '#d29922',
      borderWidth: 1,
      borderDash: [4, 3],
      label: {
        display: true,
        content: '$' + fmtShort(v),
        position: 'start',
        backgroundColor: 'rgba(22,27,34,0.8)',
        color: '#8b949e',
        font: { size: 9 },
        padding: 2,
      }
    };
  });

  charts.projections = new Chart(document.getElementById('chartProjections'), {
    type: 'line', data: { labels: p.projDates, datasets: [
      { label: 'Current liquid investments', data: p.existing, borderColor: '#4dabf7', backgroundColor: 'rgba(77,171,247,0.4)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
      { label: 'Contributions', data: p.contributions, borderColor: '#69db7c', backgroundColor: 'rgba(105,219,124,0.4)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
    ]}, options: {
      ...baseOpts(),
      scales: {
        x: { ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8, callback: function(value) { const raw = this.getLabelForValue(value); const d = new Date(raw); return isNaN(d) ? raw : d.toLocaleDateString('en-US', {month:'short', year:'2-digit'}); } } },
        y: { stacked: true, min: 0, ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtShort(v) }, grid: { color: 'rgba(201,209,217,0.1)' } }
      },
      plugins: { ...baseOpts().plugins, annotation: { annotations } },
    },
  });
}

function drawStacked() {
  if (charts.stacked) { charts.stacked.destroy(); charts.stacked = null; }
  const f = filterDates(DATA.series.dates, [DATA.series.retirement, DATA.series.non_retirement], TF_MAIN[tfState.stacked]);
  charts.stacked = new Chart(document.getElementById('chartStacked'), {
    type: 'bar', data: { labels: f.dates, datasets: [
      { label: 'Non-Retirement', data: f.series[1], backgroundColor: CC.nonRetirement, borderRadius: 2 },
      { label: 'Retirement', data: f.series[0], backgroundColor: CC.retirement, borderRadius: 2 },
    ]}, options: {
      ...baseOpts(),
      scales: {
        x: { stacked: true, ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8 } },
        y: { stacked: true, ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtShort(v) }, grid: { color: 'rgba(201,209,217,0.1)' } }
      }
    },
  });
}

function drawPie() {
  const li = DATA.series.dates.length - 1;
  const ret = DATA.series.retirement[li];
  const non = DATA.series.non_retirement[li];
  charts.stacked = new Chart(document.getElementById('chartStacked'), {
    type: 'doughnut', data: {
      labels: ['Retirement', 'Non-Retirement'],
      datasets: [{ data: [ret, non], backgroundColor: [CC.retirement, CC.nonRetirement], borderColor: '#161b22', borderWidth: 2 }]
    }, options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '55%',
      plugins: {
        legend: { position: 'bottom', labels: { color: '#8b949e', font: { size: 11 }, padding: 16 } },
        tooltip: { callbacks: { label: ctx => '  ' + ctx.label + ': $' + fmtShort(ctx.raw) + ' (' + (ctx.raw/(ret+non)*100).toFixed(0) + '%)' } },
        datalabels: {
          color: '#fff', font: { size: 13, weight: 'bold' },
          formatter: (v, ctx) => ctx.chart.data.labels[ctx.dataIndex] + '\n$' + fmtShort(v) + '\n' + (v/(ret+non)*100).toFixed(0) + '%',
          textAlign: 'center',
        }
      }
    },
  });
}

let stackedMode = 'bar';
function setStackedMode(mode) {
  if (stackedMode === mode) return;
  stackedMode = mode;
  document.getElementById('segBar').style.background = mode === 'bar' ? '#C9A961' : 'transparent';
  document.getElementById('segBar').style.color = mode === 'bar' ? '#000' : '#8b949e';
  document.getElementById('segPie').style.background = mode === 'pie' ? '#C9A961' : 'transparent';
  document.getElementById('segPie').style.color = mode === 'pie' ? '#000' : '#8b949e';
  document.getElementById('segBar').setAttribute('aria-pressed', mode === 'bar');
  document.getElementById('segPie').setAttribute('aria-pressed', mode === 'pie');
  document.getElementById('timeframeBarStacked').style.display = mode === 'pie' ? 'none' : '';
  if (mode === 'bar') {
    if (charts.stacked) { charts.stacked.destroy(); charts.stacked = null; }
    drawStacked();
  } else {
    if (charts.stacked) { charts.stacked.destroy(); charts.stacked = null; }
    drawPie();
  }
}

function drawStackedOrPie() {
  if (stackedMode === 'pie') drawPie();
  else drawStacked();
}

function destroyAllCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = {};
}

// --- Projection engine ---
let projCache = null;
function calcProjections(income, expenses, taxRate, growthPct, horizonYears) {
  const s = DATA.series;
  const lastIdx = s.dates.length - 1;
  const liquidNW = s.net_worth_ex_housing[lastIdx];
  const horizonMonths = horizonYears * 12;
  const r = growthPct / 100, monthlyR = r / 12;
  const netSavings = Math.max(0, (income * 1000 * (1 - taxRate/100) - expenses * 1000) / 12);

  // Track two components: current NW compounding, and contributions + their growth
  const existing = [];    // current NW compounding without new money
  const contributions = []; // new contributions + their compounded growth
  const total = [];

  let nwExisting = liquidNW;
  let nwContrib = 0;

  for (let m = 0; m <= horizonMonths; m++) {
    existing.push(Math.round(nwExisting));
    contributions.push(Math.round(nwContrib));
    total.push(Math.round(nwExisting + nwContrib));
    // Grow existing NW
    nwExisting = nwExisting * (1 + monthlyR);
    // Grow existing contributions, then add this month's savings
    nwContrib = nwContrib * (1 + monthlyR) + netSavings;
  }

  const lastDate = new Date(s.dates[lastIdx]);
  const projDates = [];
  for (let m = 0; m <= horizonMonths; m++) { const d = new Date(lastDate); d.setMonth(d.getMonth()+m); projDates.push(d.toISOString().slice(0,10)); }
  return { projDates, existing, contributions, total };
}

function recalcProjections() {
  const income = Math.max(0, Math.min(1000, parseFloat(document.getElementById('projIncome').value) || 0));
  const taxRate = Math.max(0, Math.min(100, parseFloat(document.getElementById('projTax').value) || 0));
  const expenses = Math.max(0, Math.min(500, parseFloat(document.getElementById('projExpenses').value) || 0));
  const growth = Math.max(0, Math.min(15, parseFloat(document.getElementById('projGrowth').value) || 0));
  const horizon = Math.max(1, Math.min(30, parseInt(document.getElementById('projHorizon').value) || 1));
  localStorage.setItem('networth-projection-inputs', JSON.stringify({ income, taxRate, expenses, growth, horizon }));
  projCache = calcProjections(income, expenses, taxRate, growth, horizon);
  drawProjectionsFn();
  buildAchievementPanel();
}

function resetProjectionDefaults() {
  localStorage.removeItem('networth-projection-inputs');
  applyProjectionDefaults();
  recalcProjections();
}

function applyProjectionDefaults() {
  const d = DATA.projection_defaults || {};
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('networth-projection-inputs') || '{}'); } catch (_) {}
  document.getElementById('projGrowth').value = saved.growth ?? d.growth_rate ?? 7;
  document.getElementById('projHorizon').value = saved.horizon ?? d.horizon_years ?? 10;
  document.getElementById('projIncome').value = saved.income ?? d.income_thousands ?? 400;
  document.getElementById('projTax').value = saved.taxRate ?? d.tax_rate ?? 35;
  document.getElementById('projExpenses').value = saved.expenses ?? d.expenses_thousands ?? 108;
}

// --- Milestones ---
function getCurrentValues() {
  const s = DATA.series; const li = s.dates.length - 1;
  return {
    liquidNW: s.net_worth_ex_housing[li], totalNW: s.net_worth_total[li],
    retirement: s.retirement[li], nonRetirement: s.non_retirement[li],
    homeEquity: s.net_worth_total[li] - s.net_worth_ex_housing[li],
  };
}

function buildMilestones(proj) {
  const cur = getCurrentValues();
  const c = DATA.current || {};
  const expenses = c.expenses ?? 96000;
  function findCrossMonth(target) {
    for (let m = 0; m < proj.total.length; m++) { if (proj.total[m] >= target) return m; }
    return -1;
  }
  function crossDate(months) {
    if (months < 0) return null;
    const d = new Date(proj.projDates[months]);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
  }
  const milestones = [];
  [1e6, 2e6, 3e6, 4e6, 5e6, 7.5e6, 10e6].forEach(v => {
    const pct = cur.liquidNW / v;
    const m = findCrossMonth(v);
    milestones.push({ type: 'liquid', name: '$' + fmtShort(v) + ' liquid', value: v, current: cur.liquidNW, pct, crossMonths: m, crossDate: crossDate(m), status: cur.liquidNW >= v ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  if (DATA.current && DATA.current.mortgage_balance != null) {
    const totalHome = cur.homeEquity + DATA.current.mortgage_balance;
    [0.50, 0.75, 1.0].forEach(pct => {
      const curPct = totalHome > 0 ? cur.homeEquity / totalHome : 0;
      milestones.push({ type: 'home', name: (pct*100).toFixed(0) + '% home equity', value: totalHome * pct, current: cur.homeEquity, pct: curPct / pct, crossMonths: -1, crossDate: null, status: curPct >= pct ? 'done' : (curPct >= pct*0.75 ? 'close' : 'far') });
    });
  }
  [{ name: 'Coast FIRE', mult: 0, desc: 'investments grow to cover retirement by 65' },{ name: 'Lean FIRE', mult: 25, desc: '25x annual expenses' },{ name: 'Full FIRE', mult: 33, desc: '33x expenses (3% SWR)' },{ name: 'Fat FIRE', mult: 40, desc: '40x expenses - luxury forever' }].forEach(ft => {
    const target = ft.mult > 0 ? expenses * ft.mult : cur.liquidNW;
    const pct = ft.mult > 0 ? cur.liquidNW / target : 0.5;
    const m = ft.mult > 0 ? findCrossMonth(target) : -1;
    milestones.push({ type: 'fire', name: ft.name, value: target, desc: ft.desc, current: ft.mult > 0 ? cur.liquidNW : 0, pct, crossMonths: m, crossDate: crossDate(m), status: ft.mult > 0 && cur.liquidNW >= target ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  [1, 3, 5].forEach(yrs => {
    const target = expenses * yrs;
    const pct = cur.nonRetirement / target;
    milestones.push({ type: 'bridge', name: yrs + '-year bridge', value: target, desc: yrs + ' years of expenses in non-retirement', current: cur.nonRetirement, pct, crossMonths: -1, crossDate: null, status: cur.nonRetirement >= target ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  return milestones;
}

function buildAchievementPanel() {
  if (!projCache) return;
  const milestones = buildMilestones(projCache);
  const panel = document.getElementById('achPanel');
  if (!panel) return;

  const completed = milestones.filter(m => m.status === 'done').length;
  const pending = milestones.filter(m => m.status !== 'done').sort((a, b) => b.pct - a.pct);
  const summary = document.getElementById('achSummary');
  if (summary) {
    const next = pending[0];
    summary.textContent = completed + ' of ' + milestones.length + ' complete' + (next ? ' · Next: ' + next.name : ' · All milestones reached');
  }

  const groups = [
    { key: 'liquid', title: 'Liquid net worth', icon: '◆' },
    { key: 'fire', title: 'FIRE milestones', icon: '✦' },
    { key: 'bridge', title: 'Bridge fund', icon: '→' },
    { key: 'home', title: 'Home equity', icon: '⌂' },
  ];

  let html = '<div class="achievement-grid">';
  groups.forEach(g => {
    milestones.filter(m => m.type === g.key).forEach(m => {
      const pct = Math.min(100, Math.max(0, m.pct * 100));
      const cls = m.status === 'done' ? 'done' : (m.status === 'close' ? 'close' : 'far');
      const status = m.status === 'done' ? 'Complete' : (m.status === 'close' ? 'Next up' : 'In progress');
      const desc = m.desc || ('Target: $' + fmtShort(m.value));
      const target = '$' + fmtShort(m.value);
      const current = '$' + fmtShort(m.current);
      const dateText = m.crossDate ? 'Est. ' + m.crossDate : (m.status === 'done' ? 'Completed' : 'No date yet');
      html += '<article class="achievement-card ' + cls + '">';
      html += '<div class="achievement-card-head"><div><div class="achievement-card-title">' + g.icon + ' ' + m.name + '</div><div class="achievement-card-category">' + g.title + '</div></div><div class="achievement-status ' + cls + '">' + status + '</div></div>';
      html += '<div class="achievement-description">' + desc + '</div>';
      html += '<div class="achievement-progress" role="progressbar" aria-label="' + m.name + ' progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct.toFixed(0) + '"><div class="achievement-progress-fill ' + cls + '" style="width:' + pct + '%"></div></div>';
      html += '<div class="achievement-card-foot"><span>' + current + ' of ' + target + '</span><span class="' + (dateText === 'No date yet' ? 'no-date' : '') + '">' + dateText + '</span></div>';
      html += '</article>';
    });
  });
  html += '</div>';
  panel.innerHTML = html;
}

function toggleAchievements() {
  const panel = document.getElementById('achPanel');
  const caret = document.getElementById('achCaret');
  const open = panel.style.display === 'none';
  panel.style.display = open ? 'block' : 'none';
  caret.textContent = open ? '↑' : '↓';
  document.getElementById('achToggleLabel').textContent = open ? 'Hide details' : 'View details';
  document.querySelector('.ach-toggle').setAttribute('aria-expanded', open);
  localStorage.setItem('networth-achievements-open', String(open));
  if (open) buildAchievementPanel();
}

// --- Main ---
function initDashboard() {
  const s = DATA.series;
  const li = s.dates.length - 1;
  const pi = Math.max(0, li - 1);
  const nw = s.net_worth_total[li];
  const nwPrev = s.net_worth_total[pi];
  const deltaNW = nw - nwPrev;
  const deltaPctNW = nwPrev > 0 ? (deltaNW / nwPrev * 100) : 0;

  const liquid = s.net_worth_ex_housing[li];
  const liquidPrev = s.net_worth_ex_housing[pi];
  const deltaLiquid = liquid - liquidPrev;
  const deltaPctLiquid = liquidPrev > 0 ? (deltaLiquid / liquidPrev * 100) : 0;

  const ret = s.retirement[li];
  const retPrev = s.retirement[pi];
  const deltaRet = ret - retPrev;
  const deltaPctRet = retPrev > 0 ? (deltaRet / retPrev * 100) : 0;

  document.getElementById('dateRange').textContent = 'Latest: ' + s.dates[li] + ' · ' + s.dates[0] + ' → ' + s.dates[li];
  document.getElementById('statsRow').innerHTML = [
    { l: 'Net Worth', v: '$'+fmtShort(nw), d: (deltaNW>=0?'+':'')+'$'+fmtShort(Math.abs(deltaNW))+' ('+(deltaPctNW>=0?'+':'')+deltaPctNW.toFixed(1)+'%)', pos: deltaNW>=0 },
    { l: 'Liquid NW', v: '$'+fmtShort(liquid), d: (deltaLiquid>=0?'+':'')+'$'+fmtShort(Math.abs(deltaLiquid))+' ('+(deltaPctLiquid>=0?'+':'')+deltaPctLiquid.toFixed(1)+'%)', pos: deltaLiquid>=0 },
    { l: 'Retirement', v: '$'+fmtShort(ret), d: (deltaRet>=0?'+':'')+'$'+fmtShort(Math.abs(deltaRet))+' ('+(deltaPctRet>=0?'+':'')+deltaPctRet.toFixed(1)+'%)', pos: deltaRet>=0 },
    { l: 'Snapshots', v: String(s.dates.length), d: '', pos: true },
  ].map(st => '<div class="stat-box"><div class="label">'+st.l+'</div><div class="value">'+st.v+'</div>'+(st.d?'<div class="delta '+(st.pos?'pos':'neg')+'">'+st.d+'</div>':'')+'</div>').join('');

  destroyAllCharts();
  makeTFBar('timeframeBarNW', 'nw', TF_MAIN, drawNW);
  drawNW();
  applyProjectionDefaults();
  ['projGrowth','projHorizon','projIncome','projTax','projExpenses'].forEach(id => {
    document.getElementById(id).addEventListener('input', recalcProjections);
  });
  recalcProjections();
  makeTFBar('timeframeBarStacked', 'stacked', TF_MAIN, drawStackedOrPie);
  drawStackedOrPie();
  if (localStorage.getItem('networth-achievements-open') === 'true') toggleAchievements();
}

(function() {
  if (!DATA.password_enabled) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  }
})();

// --- Tooltip workarounds (only active in 'workaround' mode) ---
if (MODE === 'workaround') {
  // tap outside canvas dismisses tooltips
  document.addEventListener('click', function(e) {
    if (!e.target.closest('canvas')) {
      Object.values(charts).forEach(c => {
        try { if (c && c.tooltip) c.tooltip.setActiveElements([], {x:0,y:0}); } catch(_) {}
      });
    }
  });

  // second tap on same canvas toggles tooltip off
  document.addEventListener('click', function(e) {
    var canvas = e.target.closest('canvas');
    if (!canvas) return;
    var chart = charts[CHART_MAP[canvas.id]];
    if (!chart || !chart.tooltip) return;
    var active = chart.tooltip.getActiveElements();
    if (active && active.length) {
      chart.tooltip.setActiveElements([], {x:0,y:0});
    }
  }, true);

  // force-hide after touch end (fixes stuck tooltip after drag)
  document.addEventListener('touchend', function(e) {
    var canvas = e.target.closest('canvas');
    if (!canvas) return;
    var chart = charts[CHART_MAP[canvas.id]];
    if (!chart) return;
    setTimeout(function() {
      try { chart.tooltip.setActiveElements([], {x:0,y:0}); } catch(_) {}
    }, 50);
  });
}

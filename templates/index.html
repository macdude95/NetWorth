<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Net Worth Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117; color: #c9d1d9; padding: 12px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; color: #f0f6fc; }
    .subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 16px; }
    .section { margin-bottom: 28px; }
    .section h2 { font-size: 1.05rem; color: #f0f6fc; margin-bottom: 10px; border-bottom: 1px solid #21262d; padding-bottom: 4px; display:flex; justify-content:space-between; align-items:center; }
    .chart-wrapper { position: relative; width: 100%; background: #161b22; border-radius: 8px; padding: 12px; }
    .timeframe-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .timeframe-bar button {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer;
      transition: background 0.15s;
    }
    .timeframe-bar button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .timeframe-bar button:hover { background: #30363d; }
    .stats-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .stat-box {
      flex: 1 1 120px; background: #161b22; border-radius: 8px;
      padding: 10px 12px; text-align: center; min-width: 110px;
    }
    .stat-box .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
    .stat-box .value { font-size: 1.2rem; font-weight: 700; color: #f0f6fc; }
    .stat-box .delta { font-size: 0.7rem; margin-top: 2px; }
    .delta.pos { color: #3fb950; } .delta.neg { color: #f85149; }
    #gate {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 70vh;
    }
    #gate form { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 280px; width: 100%; }
    #gate input[type="password"] {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d;
      background: #0d1117; color: #f0f6fc; font-size: 1rem; outline: none;
    }
    #gate input[type="password"]:focus { border-color: #1f6feb; }
    #gate button {
      width: 100%; padding: 10px; background: #238636; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    #gate .error { color: #f85149; font-size: 0.85rem; margin-top: 4px; min-height: 20px; }
    #dashboard { display: none; }
    .proj-controls {
      background: #161b22; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .proj-controls label {
      display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; color: #8b949e;
      text-transform: uppercase; min-width: 100px; flex: 1 1 130px;
    }
    .proj-controls input { 
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 6px 8px; color: #f0f6fc; font-size: 0.85rem; width: 100%;
    }
    .proj-controls input:focus { border-color: #1f6feb; outline: none; }
    .proj-controls button {
      background: #238636; color: #fff; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 0.8rem; cursor: pointer; margin-top: 8px;
    }
    .lib-toggle {
      font-size: 0.65rem; color: #8b949e; cursor: pointer; user-select: none;
      padding: 2px 8px; border: 1px solid #30363d; border-radius: 4px;
      background: #21262d;
    }
    .lib-toggle:hover { background: #30363d; }
    .ach-toggle {
      background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
      padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
      margin-bottom: 12px; width: 100%; text-align: left; display: flex;
      justify-content: space-between; align-items: center;
    }
    .ach-toggle:hover { background: #30363d; }
    .milestone-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-bottom: 1px solid #21262d; font-size: 0.82rem;
    }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-icon { font-size: 1.1rem; width: 24px; text-align: center; }
    .milestone-name { flex: 1; min-width: 120px; }
    .milestone-progress { flex: 2; }
    .progress-bar-bg { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; margin-top: 2px; }
    .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .progress-bar-fill.done { background: #3fb950; }
    .progress-bar-fill.close { background: #d29922; }
    .progress-bar-fill.far { background: #30363d; }
    .milestone-date { font-size: 0.72rem; color: #8b949e; min-width: 90px; text-align: right; }
    .milestone-status { font-size: 0.72rem; min-width: 50px; text-align: right; }
    .milestone-status.done { color: #3fb950; }
    .milestone-status.close { color: #d29922; }
    .milestone-status.far { color: #8b949e; }
    .ach-group-title { font-size: 0.72rem; color: #8b949e; text-transform: uppercase; padding: 10px 10px 4px; letter-spacing: 0.5px; }
    @media (max-width: 480px) {
      body { padding: 8px; }
      .stats-row { gap: 6px; }
      .stat-box { flex: 1 1 90px; min-width: 80px; padding: 8px; }
      .stat-box .value { font-size: 1rem; }
      .proj-controls { gap: 8px; }
      .proj-controls label { min-width: 80px; flex: 1 1 100px; }
    }
  </style>
</head>
<body>
<div id="gate">
  <form onsubmit="event.preventDefault(); checkPassword(); return false;">
    <h1 style="text-align:center;margin-bottom:8px;">🔒 Net Worth</h1>
    <input type="password" id="pw-input" placeholder="Enter password" autofocus>
    <button type="submit">Unlock</button>
    <div class="error" id="pw-error"></div>
  </form>
</div>

<div id="dashboard" class="container">
  <h1>💰 Net Worth Dashboard</h1>
  <div class="subtitle" id="dateRange"></div>
  <div class="stats-row" id="statsRow"></div>

  <!-- CHART 1: Net Worth -->
  <div class="section">
    <h2>Net Worth <span class="lib-toggle" id="libToggle" onclick="toggleLibrary()" title="Switch chart library"></span></h2>
    <div class="timeframe-bar" id="timeframeBarNW"></div>
    <div class="chart-wrapper"><div id="chartNetWorth"></div></div>
  </div>

  <!-- CHART 2: Projections -->
  <div class="section" id="projectionSection">
    <h2>Projections (30 years)</h2>
    <div class="proj-controls" id="projControls">
      <label>Investment growth (%/yr) <input type="number" id="projGrowth" value="7" step="0.5" min="0" max="30"></label>
      <button onclick="recalcProjections()">Update</button>
    </div>
    <div style="font-size:0.72rem;color:#8b949e;margin-bottom:10px;line-height:1.5">
      Starting from your current net worth, with income and expenses from your latest snapshot.
      The <b>solid line</b> is the median forecast; the <b>shaded band</b> covers 80% of possible outcomes.
    </div>
    <div class="chart-wrapper"><div id="chartProjections"></div></div>
  </div>

  <!-- CHART 3: Retirement vs Non-Retirement -->
  <div class="section">
    <h2>Retirement vs Non-Retirement</h2>
    <div class="timeframe-bar" id="timeframeBarStacked"></div>
    <div class="chart-wrapper"><div id="chartStacked"></div></div>
  </div>

  <!-- ACHIEVEMENTS -->
  <div class="section">
    <button class="ach-toggle" onclick="toggleAchievements()">
      🏆 Achievements <span id="achCaret" style="font-size:0.7rem;">▶</span>
    </button>
    <div id="achPanel" style="display:none;background:#161b22;border-radius:8px;padding:4px 0;margin-top:-4px;" class="chart-wrapper"></div>
  </div>
</div>

<script>
const DATA = __CHART_DATA_JSON__;

// --- Password gate ---
function sha256(str) {
  const encoder = new TextEncoder();
  return crypto.subtle.digest('SHA-256', encoder.encode(str))
    .then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''));
}
async function checkPassword() {
  const input = document.getElementById('pw-input').value;
  const hash = await sha256(DATA.password.salt + input);
  if (hash === DATA.password.hash) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('pw-error').textContent = 'Wrong password';
  }
}

// --- Library toggle ---
let currentLib = DATA.chart_library || 'apexcharts';
document.getElementById('libToggle').textContent = currentLib === 'apexcharts' ? 'Apex' : 'Chart.js';

function toggleLibrary() {
  currentLib = currentLib === 'apexcharts' ? 'chartjs' : 'apexcharts';
  document.getElementById('libToggle').textContent = currentLib === 'apexcharts' ? 'Apex' : 'Chart.js';
  destroyAllCharts();
  initDashboard();
}

function destroyAllCharts() {
  ['nw','projections','stacked'].forEach(k => {
    try { ApexCharts.exec(k, 'destroy'); } catch(e) {}
    try { if (charts[k]) { charts[k].destroy(); charts[k] = null; } } catch(e) {}
  });
  charts = {};
}

// --- Colors ---
const CC = {
  total: '#1f6feb', exHousing: '#3fb950', retirement: '#d29922', nonRetirement: '#58a6ff',
  projP50: '#a5d6ff', projBand: 'rgba(88,166,255,0.25)',
  grid: '#21262d', tick: '#8b949e', bg: '#161b22',
};

function fmtShort(n) {
  if (n == null || isNaN(n)) return 'N/A';
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (abs >= 1000) return (n / 1000).toFixed(0) + 'K';
  return n.toFixed(0);
}

function fmtFull(n) {
  if (n == null || isNaN(n)) return '';
  return '$' + n.toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:0});
}

// --- Timeframes ---
const TF_MAIN = { 'YTD': 'ytd', '1Y': 12, '5Y': 60, 'All': 'all' };

function filterDates(dates, seriesArr, tf) {
  if (tf === 'all') return { dates, series: seriesArr };
  const lastDate = new Date(dates[dates.length - 1]);
  let cutoff;
  if (tf === 'ytd') { cutoff = new Date(lastDate.getFullYear(), 0, 1); }
  else { cutoff = new Date(lastDate); cutoff.setMonth(cutoff.getMonth() - tf); }
  const idx = [];
  dates.forEach((d, i) => { if (new Date(d) >= cutoff || i >= dates.length - 2) idx.push(i); });
  return { dates: idx.map(i => dates[i]), series: seriesArr.map(s => idx.map(i => s[i])) };
}

let charts = {};
let tf = { nw: 'All', stacked: 'All' };

function makeTFBar(parentId, key, labels, redraw) {
  const bar = document.getElementById(parentId);
  bar.innerHTML = '';
  Object.keys(labels).forEach(l => {
    const btn = document.createElement('button');
    btn.textContent = l; btn.className = tf[key] === l ? 'active' : '';
    btn.onclick = () => { tf[key] = l; bar.querySelectorAll('button').forEach(b => b.className = ''); btn.className = 'active'; redraw(); };
    bar.appendChild(btn);
  });
}

// --- ApexCharts dark theme defaults ---
function apexOpts(extra) {
  return {
    chart: {
      type: extra.type || 'line',
      background: CC.bg,
      foreColor: CC.tick,
      toolbar: { show: false },
      zoom: { enabled: false },
      animations: { enabled: true, speed: 300 },
    },
    stroke: { curve: 'straight', width: extra.strokeWidth || 2 },
    markers: { size: extra.markers || 2 },
    grid: { borderColor: CC.grid, strokeDashArray: 2 },
    xaxis: { labels: { style: { colors: CC.tick, fontSize: '10px' } }, axisBorder: { color: CC.grid }, axisTicks: { color: CC.grid } },
    yaxis: { labels: { style: { colors: CC.tick, fontSize: '10px' }, formatter: v => fmtShort(v) } },
    tooltip: { theme: 'dark', x: { format: 'yyyy-MM-dd' } },
    legend: { labels: { colors: CC.tick }, fontSize: '11px' },
    ...extra,
  };
}

// === APEXCHARTS RENDERERS ===

function drawNW_apex() {
  const f = filterDates(DATA.series.dates, [DATA.series.net_worth_total, DATA.series.net_worth_ex_housing], TF_MAIN[tf.nw]);
  const opts = apexOpts({
    type: 'line',
    series: [
      { name: 'Total', data: f.series[0].map((v,i) => ({x: f.dates[i], y: v})), color: '#4dabf7' },
      { name: 'Excl. Home', data: f.series[1].map((v,i) => ({x: f.dates[i], y: v})), color: '#69db7c' },
    ],
    stroke: { curve: 'straight', width: [2.5, 2], dashArray: [0, 5] },
    markers: { size: [0, 0], strokeWidth: 0 },
    fill: { type: ['gradient'], gradient: { shade: 'dark', type: 'vertical', opacityFrom: 0.25, opacityTo: 0.02 } },
    legend: { position: 'top', horizontalAlign: 'left', fontSize: '11px', markers: { width: 20, height: 3, radius: 1 } },
  });
  const chart = new ApexCharts(document.getElementById('chartNetWorth'), opts);
  chart.render();
  charts.nw = chart;
}

function drawProjections_apex() {
  if (!projCache) recalcProjections();
  const p = projCache;
  const opts = apexOpts({
    type: 'line',
    series: [
      {
        name: '80% range',
        data: p.lower.map((v,i) => ({x: p.projDates[i], y: v})),
        type: 'area',
        color: '#74c0fc',
        fill: { type: 'gradient', gradient: { shade: 'dark', type: 'vertical', opacityFrom: 0.2, opacityTo: 0.02 } },
        stroke: { width: 0 },
        legend: { show: false },
      },
      {
        name: 'Range top',
        data: p.upper.map((v,i) => ({x: p.projDates[i], y: v})),
        color: 'transparent',
        stroke: { width: 0 },
        legend: { show: false },
      },
      {
        name: 'Median',
        data: p.median.map((v,i) => ({x: p.projDates[i], y: v})),
        color: '#74c0fc',
        stroke: { width: 2.5, curve: 'straight' },
        markers: { size: 0 },
      },
    ],
    legend: { position: 'top', horizontalAlign: 'left', fontSize: '11px', markers: { width: 20, height: 3, radius: 1 } },
  });
  const chart = new ApexCharts(document.getElementById('chartProjections'), opts);
  chart.render();
  charts.projections = chart;
}

function drawStacked_apex() {
  const f = filterDates(DATA.series.dates, [DATA.series.retirement, DATA.series.non_retirement], TF_MAIN[tf.stacked]);
  const opts = {
    chart: {
      type: 'bar', stacked: true,
      background: CC.bg, foreColor: CC.tick,
      toolbar: { show: false }, zoom: { enabled: false },
      animations: { enabled: false },
    },
    series: [
      { name: 'Non-Retirement', data: f.series[1].map((v,i) => ({x: f.dates[i], y: v})), color: '#4dabf7' },
      { name: 'Retirement', data: f.series[0].map((v,i) => ({x: f.dates[i], y: v})), color: '#fcc419' },
    ],
    plotOptions: { bar: { borderRadius: 0, columnWidth: '60%', dataLabels: { position: 'center' } } },
    dataLabels: { enabled: false },
    xaxis: { labels: { style: { colors: CC.tick, fontSize: '9px' }, rotate: -45, maxItems: 8 }, axisBorder: { color: CC.grid }, axisTicks: { color: CC.grid } },
    yaxis: { labels: { style: { colors: CC.tick, fontSize: '10px' }, formatter: v => fmtShort(v) } },
    grid: { borderColor: CC.grid, strokeDashArray: 2 },
    tooltip: { theme: 'dark', x: { format: 'yyyy-MM-dd' }, y: { formatter: v => fmtFull(v) } },
    legend: { position: 'top', horizontalAlign: 'left', fontSize: '11px', labels: { colors: CC.tick }, markers: { width: 12, height: 12, radius: 2 } },
  };
  const chart = new ApexCharts(document.getElementById('chartStacked'), opts);
  chart.render();
  charts.stacked = chart;
}

// === CHART.JS RENDERERS ===

function baseOpts() {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#8b949e', font: { size: 11 } } } },
    scales: {
      x: { ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8 } },
      y: { ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtShort(v) }, grid: { color: 'rgba(201,209,217,0.1)' } }
    },
    interaction: { intersect: false, mode: 'index' },
  };
}

function drawNW_chartjs() {
  const f = filterDates(DATA.series.dates, [DATA.series.net_worth_total, DATA.series.net_worth_ex_housing], TF_MAIN[tf.nw]);
  const container = document.getElementById('chartNetWorth');
  container.innerHTML = '<canvas></canvas>';
  const canvas = container.querySelector('canvas');
  charts.nw = new Chart(canvas.getContext('2d'), {
    type: 'line', data: { labels: f.dates, datasets: [
      { label: 'Total', data: f.series[0], borderColor: CC.total, backgroundColor: 'rgba(31,111,235,0.1)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 },
      { label: 'Excl. Home Equity', data: f.series[1], borderColor: CC.exHousing, borderDash: [5,3], fill: false, tension: 0.3, pointRadius: 2, borderWidth: 2 },
    ]}, options: baseOpts(),
  });
}

function drawProjections_chartjs() {
  if (!projCache) recalcProjections();
  const p = projCache;
  const container = document.getElementById('chartProjections');
  container.innerHTML = '<canvas></canvas>';
  const canvas = container.querySelector('canvas');
  charts.projections = new Chart(canvas.getContext('2d'), {
    type: 'line', data: { labels: p.projDates, datasets: [
      { data: p.upper, borderColor: 'transparent', backgroundColor: 'transparent', fill: false, pointRadius: 0 },
      { label: 'Median forecast', data: p.median, borderColor: '#a5d6ff', fill: false, tension: 0.3, pointRadius: 1, borderWidth: 2 },
      { label: '80% range', data: p.lower, borderColor: 'transparent', backgroundColor: 'rgba(88,166,255,0.25)', fill: '-1', tension: 0.3, pointRadius: 0 },
    ]}, options: {
      ...baseOpts(),
      plugins: { legend: { labels: { color: '#8b949e', font: { size: 10 }, filter: function(item) { return item.text && item.text.length > 0; } } } }
    },
  });
}

function drawStacked_chartjs() {
  const f = filterDates(DATA.series.dates, [DATA.series.retirement, DATA.series.non_retirement], TF_MAIN[tf.stacked]);
  const container = document.getElementById('chartStacked');
  container.innerHTML = '<canvas></canvas>';
  const canvas = container.querySelector('canvas');
  charts.stacked = new Chart(canvas.getContext('2d'), {
    type: 'bar', data: { labels: f.dates, datasets: [
      { label: 'Non-Retirement', data: f.series[1], backgroundColor: CC.nonRetirement, borderRadius: 2 },
      { label: 'Retirement', data: f.series[0], backgroundColor: CC.retirement, borderRadius: 2 },
    ]}, options: {
      ...baseOpts(),
      scales: {
        x: { stacked: true, ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8 } },
        y: { stacked: true, ticks: { color: '#8b949e', font: { size: 10 }, callback: v => fmtShort(v) }, grid: { color: 'rgba(201,209,217,0.1)' } }
      }
    },
  });
}

// === DISPATCH ===

function drawNW() { return currentLib === 'apexcharts' ? drawNW_apex() : drawNW_chartjs(); }
function drawProjectionsFn() { return currentLib === 'apexcharts' ? drawProjections_apex() : drawProjections_chartjs(); }
function drawStacked() { return currentLib === 'apexcharts' ? drawStacked_apex() : drawStacked_chartjs(); }

// --- Projection engine (shared) ---
let projCache = null;
function calcProjections(expenses, income, growthPct) {
  const s = DATA.series;
  const lastIdx = s.dates.length - 1;
  const totalNW = s.net_worth_total[lastIdx];
  const horizonMonths = 30 * 12;
  const r = growthPct / 100, monthlyR = r / 12;
  const netSavings = Math.max(0, (income - expenses) / 12);
  const annualVol = 0.15;
  const median = [];
  let nw = totalNW;
  for (let m = 0; m <= horizonMonths; m++) { median.push(Math.round(nw)); nw = nw * (1 + monthlyR) + netSavings; }
  const upper = [], lower = [];
  for (let m = 0; m <= horizonMonths; m++) {
    const t = m / 12;
    const sigma = totalNW * annualVol * Math.sqrt(t);
    const band = 1.28 * sigma;
    lower.push(Math.round(Math.max(0, median[m] - band)));
    upper.push(Math.round(median[m] + band));
  }
  const lastDate = new Date(s.dates[lastIdx]);
  const projDates = [];
  for (let m = 0; m <= horizonMonths; m++) { const d = new Date(lastDate); d.setMonth(d.getMonth()+m); projDates.push(d.toISOString().slice(0,10)); }
  return { projDates, median, lower, upper };
}

function recalcProjections() {
  const growth = parseFloat(document.getElementById('projGrowth').value) || 7;
  const c = DATA.current || {};
  const expenses = c.expenses || 96000;
  const income = c.income || 200000;
  projCache = calcProjections(expenses, income, growth);
  drawProjectionsFn();
  buildAchievementPanel();
}

// --- Milestones ---
function getCurrentValues() {
  const s = DATA.series; const li = s.dates.length - 1;
  return {
    liquidNW: s.net_worth_ex_housing[li], totalNW: s.net_worth_total[li],
    retirement: s.retirement[li], nonRetirement: s.non_retirement[li],
    homeEquity: s.net_worth_total[li] - s.net_worth_ex_housing[li],
  };
}

function buildMilestones(proj) {
  const cur = getCurrentValues();
  const c = DATA.current || {};
  const expenses = c.expenses || 96000;
  function findCrossMonth(target) {
    for (let m = 0; m < proj.median.length; m++) { if (proj.median[m] >= target) return m; }
    return -1;
  }
  function crossDate(months) {
    if (months < 0) return null;
    const d = new Date(proj.projDates[months]);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
  }
  const milestones = [];
  [1e6, 2e6, 3e6, 4e6, 5e6, 7.5e6, 10e6].forEach(v => {
    const pct = cur.liquidNW / v;
    const m = findCrossMonth(v);
    milestones.push({ type: 'liquid', name: '$' + fmtShort(v) + ' liquid', value: v, current: cur.liquidNW, pct, crossMonths: m, crossDate: crossDate(m), status: cur.liquidNW >= v ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  if (DATA.current && DATA.current.mortgage_balance != null) {
    const totalHome = cur.homeEquity + DATA.current.mortgage_balance;
    [0.50, 0.75, 1.0].forEach(pct => {
      const curPct = totalHome > 0 ? cur.homeEquity / totalHome : 0;
      milestones.push({ type: 'home', name: (pct*100).toFixed(0) + '% home equity', value: totalHome * pct, current: cur.homeEquity, pct: curPct / pct, crossMonths: -1, crossDate: null, status: curPct >= pct ? 'done' : (curPct >= pct*0.75 ? 'close' : 'far') });
    });
  }
  [{ name: 'Coast FIRE', mult: 0, desc: 'investments grow to cover retirement by 65' },{ name: 'Lean FIRE', mult: 25, desc: '25× annual expenses' },{ name: 'Full FIRE', mult: 33, desc: '33× expenses (3% SWR)' },{ name: 'Fat FIRE', mult: 40, desc: '40× expenses — luxury forever' }].forEach(ft => {
    const target = ft.mult > 0 ? expenses * ft.mult : cur.liquidNW;
    const pct = ft.mult > 0 ? cur.liquidNW / target : 0.5;
    const m = ft.mult > 0 ? findCrossMonth(target) : -1;
    milestones.push({ type: 'fire', name: ft.name, value: target, desc: ft.desc, current: ft.mult > 0 ? cur.liquidNW : 0, pct, crossMonths: m, crossDate: crossDate(m), status: ft.mult > 0 && cur.liquidNW >= target ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  [1, 3, 5].forEach(yrs => {
    const target = expenses * yrs;
    const pct = cur.nonRetirement / target;
    milestones.push({ type: 'bridge', name: yrs + '-year bridge', value: target, desc: yrs + ' years of expenses in non-retirement', current: cur.nonRetirement, pct, crossMonths: -1, crossDate: null, status: cur.nonRetirement >= target ? 'done' : (pct >= 0.75 ? 'close' : 'far') });
  });
  return milestones;
}

function buildAchievementPanel() {
  if (!projCache) return;
  const milestones = buildMilestones(projCache);
  const panel = document.getElementById('achPanel');
  if (!panel) return;
  const groups = [
    { key: 'liquid', title: '\ud83d\udcb0 Liquid Net Worth' },
    { key: 'fire', title: '\ud83d\udd25 FIRE Milestones' },
    { key: 'bridge', title: '\ud83c\udf09 Bridge Fund (non-retirement)' },
    { key: 'home', title: '\ud83c\udfe0 Home Equity' },
  ];
  let html = '';
  groups.forEach(g => {
    const items = milestones.filter(m => m.type === g.key);
    if (items.length === 0) return;
    html += '<div class="ach-group-title">' + g.title + '</div>';
    items.forEach(m => {
      const pct = Math.min(100, Math.max(0, m.pct * 100));
      const barClass = m.status === 'done' ? 'done' : (m.status === 'close' ? 'close' : 'far');
      const statusText = m.status === 'done' ? '\u2705' : (m.status === 'close' ? '\ud83d\udd36' : '\u2b1c');
      const dateText = m.crossDate ? 'Est. ' + m.crossDate : (m.status === 'done' ? 'Done' : '');
      html += '<div class="milestone-row">';
      html += '<div class="milestone-icon">' + statusText + '</div>';
      html += '<div class="milestone-name">' + m.name + (m.desc ? '<div style="font-size:0.68rem;color:#8b949e">' + m.desc + '</div>' : '') + '</div>';
      html += '<div class="milestone-progress"><div class="progress-bar-bg"><div class="progress-bar-fill ' + barClass + '" style="width:' + pct + '%"></div></div></div>';
      html += '<div class="milestone-date">' + dateText + '</div>';
      html += '<div class="milestone-status ' + barClass + '">' + pct.toFixed(0) + '%</div>';
      html += '</div>';
    });
  });
  panel.innerHTML = html || '<div style="padding:12px;color:#8b949e">Add real data to see achievements.</div>';
}

function toggleAchievements() {
  const panel = document.getElementById('achPanel');
  const caret = document.getElementById('achCaret');
  if (panel.style.display === 'none') { panel.style.display = 'block'; caret.textContent = '\u25bc'; buildAchievementPanel(); }
  else { panel.style.display = 'none'; caret.textContent = '\u25b6'; }
}

// --- Main ---
function initDashboard() {
  const s = DATA.series;
  const lastIdx = s.dates.length - 1;
  const prevIdx = Math.max(0, lastIdx - 1);
  const nw = s.net_worth_total[lastIdx];
  const nwPrev = s.net_worth_total[prevIdx];
  const delta = nw - nwPrev;
  const deltaPct = nwPrev > 0 ? (delta / nwPrev * 100) : 0;
  const nwEx = s.net_worth_ex_housing[lastIdx];
  const ret = s.retirement[lastIdx];

  document.getElementById('dateRange').textContent = (currentLib === 'apexcharts' ? '[ApexCharts] \u2022 ' : '[Chart.js] \u2022 ') + 'Latest: ' + s.dates[lastIdx] + ' \u00b7 ' + s.dates.length + ' snapshots \u00b7 ' + s.dates[0] + ' \u2192 ' + s.dates[lastIdx];
  document.getElementById('statsRow').innerHTML = [
    { l: 'Net Worth', v: '$'+fmtShort(nw), d: `${delta>=0?'+':''}$${fmtShort(Math.abs(delta))} (${deltaPct>=0?'+':''}${deltaPct.toFixed(1)}%)`, pos: delta>=0 },
    { l: 'Excl. Home', v: '$'+fmtShort(nwEx), d: '', pos: true },
    { l: 'Retirement', v: '$'+fmtShort(ret), d: '', pos: true },
    { l: 'Snapshots', v: s.dates.length, d: '', pos: true },
  ].map(st => '<div class="stat-box"><div class="label">'+st.l+'</div><div class="value">'+st.v+'</div>'+(st.d ? '<div class="delta '+(st.pos?'pos':'neg')+'">'+st.d+'</div>' : '')+'</div>').join('');

  document.getElementById('libToggle').textContent = currentLib === 'apexcharts' ? 'Apex' : 'Chart.js';

  // Clear chart containers (div instead of canvas)
  ['chartNetWorth','chartProjections','chartStacked'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });

  makeTFBar('timeframeBarNW', 'nw', TF_MAIN, drawNW);
  drawNW();
  document.getElementById('projGrowth').value = '7';
  recalcProjections();
  makeTFBar('timeframeBarStacked', 'stacked', TF_MAIN, drawStacked);
  drawStacked();
}

// --- Auto-init when password disabled ---
(function() {
  if (!DATA.password_enabled) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
  }
})();
